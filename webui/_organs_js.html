<script>
(function () {
  'use strict';

  // expanded：哪些分组被展开过（点「展开其余 N 项」）。
  // 记在 STATE 里而不是 DOM 里：15 秒一轮自动刷新会重建 innerHTML，
  // 状态若只存在 DOM 上，用户刚展开的卡片下一轮就自己收回去。
  var STATE = { organs: null, foods: null, active: '', foodGroup: '', expanded: {},
    // 2026-11-27（1.4.1-dev）：食物库的搜索/排序/分页状态
    foodQuery: '', foodSort: '', foodDesc: false, foodPage: 0, foodDense: false };

  function $(id) { return document.getElementById(id); }
  function txt(id, v) { var el = $(id); if (el) el.textContent = v; }

  function showError(msg) {
    var box = $('err');
    if (!msg) { if (box) box.classList.remove('on'); return; }
    if (box) box.classList.add('on');
    txt('err-text', msg);
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function renderTabs() {
    var d = STATE.organs || {};
    var groups = d.groups || [];
    var box = $('tabs');
    if (!box) return;
    var list = [{ id: '', title: '全部' }].concat(groups.map(function (g) { return { id: g.id, title: g.title }; }));
    box.innerHTML = list.map(function (g) {
      var on = (g.id === STATE.active) ? ' on' : '';
      return '<button type="button" class="lb-chip' + on + '" data-gid="' + g.id + '">' + esc(g.title) + '</button>';
    }).join('');
    box.querySelectorAll('[data-gid]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        STATE.active = btn.getAttribute('data-gid') || '';
        renderTabs();
        renderGroups();
      });
    });
  }

  // 一行字段（label + 单位 + 值）
  function kvRow(r) {
    return '<div class="lb-kv"><span>' + esc(r.label) +
      (r.unit ? ' <em style="font-style:normal;opacity:.6">' + esc(r.unit) + '</em>' : '') +
      '</span><span>' + fmt(r.value) + '</span></div>';
  }

  // 2026-11-21（v1.3.1）：内脏页 160 个字段全量平铺等于刷屏。
  // 默认只给后端指定的「关键字段」（g.key），其余折叠；字段少的分组不折叠。
  // 关键字段的取舍在 plugin.py 的 KEY_FIELDS 里，前端不硬编码任何字段名 ——
  // 加一个字段或换一个关键量只改一处。
  function renderGroups() {
    var d = STATE.organs || {};
    var groups = d.groups || [];
    var box = $('groups');
    if (!box) return;
    var shown = groups.filter(function (g) { return !STATE.active || g.id === STATE.active; });
    if (!shown.length) { box.innerHTML = '<div class="lb-empty">没有可展示的分组</div>'; return; }
    box.innerHTML = shown.map(function (g) {
      var rows = g.rows || [];
      var keys = g.key || [];
      var isOpen = !!STATE.expanded[g.id];
      var keyRows, restRows;
      if (keys.length && keys.length < rows.length) {
        var set = {};
        keys.forEach(function (f) { set[f] = 1; });
        keyRows = rows.filter(function (r) { return set[r.field]; });
        restRows = rows.filter(function (r) { return !set[r.field]; });
      } else {
        keyRows = rows;
        restRows = [];
      }
      var body = keyRows.map(kvRow).join('') + (isOpen ? restRows.map(kvRow).join('') : '');
      var more = '';
      if (restRows.length) {
        more = '<button type="button" class="lb-more" data-more="' + esc(g.id) + '">' +
          (isOpen ? '收起（保留 ' + keyRows.length + ' 项关键）'
                  : '展开其余 ' + restRows.length + ' 项 · 共 ' + rows.length + ' 项') +
          '</button>';
      }
      return '<section class="lb-card" data-group="' + esc(g.id) + '">' +
        '<div class="lb-card-hd"><h2>' + esc(g.title) +
        '</h2><span class="lb-card-sub">' + esc(g.subtitle || '') + '</span></div>' +
        body + more + '</section>';
    }).join('');

    box.querySelectorAll('[data-more]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var gid = btn.getAttribute('data-more');
        STATE.expanded[gid] = !STATE.expanded[gid];
        renderGroups();
      });
    });
  }

  function fmt(v) {
    var n = Number(v);
    if (!isFinite(n)) return esc(v);
    if (Number.isInteger(n)) return String(n);
    return n.toFixed(Math.abs(n) < 10 ? 3 : 1).replace(/0+$/, '').replace(/\.$/, '');
  }

  // ---- 波形数据池（还原自 2026-11-14 备份，issue #11）----
  // 一次取 20 秒，前端本地按时间轴滚动播放，不反复请求接口。
  var WAVE = {
    ecg: [], eeg: [],
    ecgHz: 100, eegHz: 200,
    fetchedAt: 0,
    fetching: false,
    failed: false
  };
  var WAVE_WINDOW_SEC = 8;

  function waveColors() {
    var cs = getComputedStyle(document.documentElement);
    return {
      ecg: cs.getPropertyValue('--series-3').trim() || '#e74c3c',
      eeg: cs.getPropertyValue('--series-1').trim() || '#5c6bc0',
      grid: 'rgba(128,128,128,0.15)'
    };
  }

  async function loadWaveforms() {
    // 并发保护：宿主限制同时只能有 2 个请求。
    if (WAVE.fetching) return;
    WAVE.fetching = true;
    try {
      var res = await window.maibot.query('waveforms', { seconds: 20 });
      if (!res || res.success === false) {
        txt('wave-note', '波形不可用：' + ((res && res.error) || '未知'));
        return;
      }
      var ecg = res.ecg || {};
      var eeg = res.eeg || {};
      WAVE.ecg = ecg.points || [];
      WAVE.eeg = eeg.points || [];
      WAVE.ecgHz = ecg.hz || 100;
      WAVE.eegHz = eeg.hz || 200;
      WAVE.fetchedAt = Date.now();
      txt('wave-ecg-meta', (ecg.bpm || '?') + ' bpm · RR ' + (ecg.rr_ms || '?') + ' ms · ' + (ecg.hz || '?') + ' Hz');
      var bands = eeg.bands || {};
      var stageZh = { awake: '清醒', light: '浅睡', deep: '深睡', rem: 'REM' };
      txt('wave-eeg-meta', (stageZh[eeg.stage] || eeg.stage || '?') +
        ' · δ' + (bands.delta != null ? bands.delta.toFixed(2) : '?') +
        ' θ' + (bands.theta != null ? bands.theta.toFixed(2) : '?') +
        ' α' + (bands.alpha != null ? bands.alpha.toFixed(2) : '?') +
        ' β' + (bands.beta != null ? bands.beta.toFixed(2) : '?'));
      txt('wave-note', res.disclaimer || '仿真波形，非医学数据');
      WAVE.failed = false;
    } catch (e) {
      WAVE.failed = true;
      txt('wave-note', '波形拉取失败：' + (e && e.message ? e.message : e));
    } finally {
      WAVE.fetching = false;
    }
  }

  function renderScan(canvasId, pool, sampleHz, color, elapsedSec) {
    var cv = $(canvasId);
    if (!cv || !pool || pool.length < 2) return;
    var ctx = cv.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 600;
    var h = cv.clientHeight || 90;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var mid = h / 2, amp = h * 0.44;
    var colors = waveColors();
    ctx.strokeStyle = colors.grid;
    ctx.lineWidth = 1;
    for (var s = 1; s < WAVE_WINDOW_SEC; s++) {
      var gx = (s / WAVE_WINDOW_SEC) * w;
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();

    var n = pool.length;
    var totalSec = n / sampleHz;
    var startSec = elapsedSec % Math.max(0.001, totalSec - WAVE_WINDOW_SEC);
    if (startSec < 0) startSec = 0;
    var i0 = Math.floor(startSec * sampleHz);
    var i1 = Math.min(n - 1, Math.floor((startSec + WAVE_WINDOW_SEC) * sampleHz));
    if (i1 - i0 < 2) return;

    ctx.strokeStyle = color;
    ctx.lineWidth = 1.4;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (var i = i0; i <= i1; i++) {
      var x = ((i - i0) / (i1 - i0)) * w;
      var y = mid - pool[i] * amp;
      if (i === i0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(w - 1, 0); ctx.lineTo(w - 1, h); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  var waveStart = 0;
  var waveLoopRunning = false;

  function waveLoop(ts) {
    if (document.hidden || !document.getElementById('wave-ecg')) {
      waveLoopRunning = false;
      waveStart = 0;
      return;
    }
    waveLoopRunning = true;
    if (!waveStart) waveStart = ts;
    var elapsed = (ts - waveStart) / 1000;
    var c = waveColors();
    renderScan('wave-ecg', WAVE.ecg, WAVE.ecgHz, c.ecg, elapsed);
    renderScan('wave-eeg', WAVE.eeg, WAVE.eegHz, c.eeg, elapsed);
    if (elapsed > 16 && !WAVE.fetching && !WAVE.failed) {
      waveStart = ts;
      loadWaveforms();
    }
    requestAnimationFrame(waveLoop);
  }

  // 2026-11-27（1.4.1-dev）：食物库重做。
  //
  // 旧版一次把 312 行塞进 DOM、11 列数字平铺，只能按分组筛 —— 想知道「哪个主食蛋白高」
  // 得自己在几百行里数。现在：搜索（名称 / key / 分组）、分组 chip、点表头排序、
  // 每页 50 行、简表 / 详表切换。列定义只有一份，表头与单元格都由它生成，不会对不上。
  var FOOD_COLS = [
    { k: 'label', t: '名称' },
    { k: 'group', t: '分组' },
    { k: 'portion', t: '份量' },
    { k: 'kcal', t: '热量', num: 1 },
    { k: 'carb_g', t: '碳水', num: 1 },
    { k: 'protein_g', t: '蛋白', num: 1 },
    { k: 'fat_g', t: '脂肪', num: 1 },
    { k: 'na_mmol', t: '钠', num: 1 },
    { k: 'fiber_g', t: '纤维', num: 1 },
    { k: 'k_mg', t: '钾', num: 0 },
    { k: 'ca_mg', t: '钙', num: 0 },
    { k: 'fe_mg', t: '铁', num: 1 },
    { k: 'vc_mg', t: '维C', num: 1 },
    { k: 'alcohol_g', t: '酒精', num: 1 },
    { k: 'caffeine_mg', t: '咖啡因', num: 0 }
  ];
  var FOOD_SIMPLE = ['label', 'group', 'portion', 'kcal', 'carb_g', 'protein_g'];
  var FOOD_PAGE_SIZE = 50;

  function foodCols() {
    return STATE.foodDense ? FOOD_COLS : FOOD_COLS.filter(function (c) {
      return FOOD_SIMPLE.indexOf(c.k) >= 0;
    });
  }

  function foodGroups(all) {
    var seen = {}, out = [];
    (all || []).forEach(function (f) {
      var g = f.group || '其他';
      if (!seen[g]) { seen[g] = 0; out.push(g); }
      seen[g] += 1;
    });
    return out.map(function (g) { return { name: g, count: seen[g] }; });
  }

  function foodRows() {
    var all = (STATE.foods && STATE.foods.foods) || [];
    var q = (STATE.foodQuery || '').trim().toLowerCase();
    var out = all.filter(function (f) {
      if (STATE.foodGroup && (f.group || '其他') !== STATE.foodGroup) return false;
      if (!q) return true;
      return String(f.label || '').toLowerCase().indexOf(q) >= 0
        || String(f.key || '').toLowerCase().indexOf(q) >= 0
        || String(f.group || '').toLowerCase().indexOf(q) >= 0;
    });
    var sk = STATE.foodSort;
    if (sk) {
      var col = FOOD_COLS.filter(function (c) { return c.k === sk; })[0] || {};
      out = out.slice().sort(function (a, b) {
        var r;
        if (col.num) { r = (Number(a[sk]) || 0) - (Number(b[sk]) || 0); }
        else { r = String(a[sk] || '').localeCompare(String(b[sk] || ''), 'zh'); }
        return STATE.foodDesc ? -r : r;
      });
    }
    return out;
  }

  function renderFoodTabs() {
    var box = $('food-tabs');
    if (!box) return;
    var all = (STATE.foods && STATE.foods.foods) || [];
    var list = [{ name: '', count: all.length }].concat(foodGroups(all));
    box.innerHTML = list.map(function (g) {
      var on = (g.name === STATE.foodGroup) ? ' on' : '';
      var label = g.name ? g.name + '（' + g.count + '）' : '全部（' + g.count + '）';
      return '<button type="button" class="lb-chip' + on + '" data-fg="' + esc(g.name) + '">' + esc(label) + '</button>';
    }).join('');
    box.querySelectorAll('[data-fg]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        STATE.foodGroup = btn.getAttribute('data-fg') || '';
        STATE.foodPage = 0;
        renderFoodTabs();
        renderFoods();
      });
    });
  }

  function renderFoodHead() {
    var th = $('food-thead');
    if (!th) return;
    var cols = foodCols();
    th.innerHTML = '<tr>' + cols.map(function (c) {
      var arrow = STATE.foodSort === c.k ? (STATE.foodDesc ? ' ▼' : ' ▲') : '';
      return '<th class="sortable' + (c.num ? ' v' : '') + '" data-sk="' + c.k + '">' + c.t + arrow + '</th>';
    }).join('') + '</tr>';
    th.querySelectorAll('[data-sk]').forEach(function (el) {
      el.addEventListener('click', function () {
        var k = el.getAttribute('data-sk');
        if (STATE.foodSort === k) { STATE.foodDesc = !STATE.foodDesc; }
        else { STATE.foodSort = k; STATE.foodDesc = false; }
        STATE.foodPage = 0;
        renderFoodHead();
        renderFoods();
      });
    });
  }

  function renderFoodPager(total, pages) {
    var box = $('food-pager');
    if (!box) return;
    if (pages <= 1) { box.innerHTML = ''; return; }
    var cur = STATE.foodPage;
    box.innerHTML =
      '<button type="button" class="lb-chip" data-pg="prev"' + (cur <= 0 ? ' disabled' : '') + '>上一页</button>' +
      '<span class="lb-pager-text">第 ' + (cur + 1) + ' / ' + pages + ' 页 · 共 ' + total + ' 项</span>' +
      '<button type="button" class="lb-chip" data-pg="next"' + (cur >= pages - 1 ? ' disabled' : '') + '>下一页</button>';
    box.querySelectorAll('[data-pg]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var dir = btn.getAttribute('data-pg');
        STATE.foodPage = Math.max(0, Math.min(pages - 1, cur + (dir === 'next' ? 1 : -1)));
        renderFoods();
      });
    });
  }

  function wireFoodControls() {
    var q = $('food-q');
    if (q && !q.getAttribute('data-wired')) {
      q.setAttribute('data-wired', '1');
      q.addEventListener('input', function () {
        STATE.foodQuery = q.value || '';
        STATE.foodPage = 0;
        renderFoods();
      });
    }
    var d = $('food-density');
    if (d && !d.getAttribute('data-wired')) {
      d.setAttribute('data-wired', '1');
      d.addEventListener('click', function () {
        STATE.foodDense = !STATE.foodDense;
        d.textContent = STATE.foodDense ? '简表' : '详表';
        d.classList.toggle('on', STATE.foodDense);
        STATE.foodPage = 0;
        renderFoods();
      });
    }
  }

  function renderFoods() {
    var d = STATE.foods || {};
    var tb = $('food-table') ? $('food-table').querySelector('tbody') : null;
    var rows = foodRows();
    var cols = foodCols();
    var pages = Math.max(1, Math.ceil(rows.length / FOOD_PAGE_SIZE));
    if (STATE.foodPage > pages - 1) STATE.foodPage = pages - 1;
    var start = STATE.foodPage * FOOD_PAGE_SIZE;
    var view = rows.slice(start, start + FOOD_PAGE_SIZE);

    txt('food-count', '共 ' + (d.count || rows.length) + ' 项'
      + (STATE.foodGroup ? '，当前「' + STATE.foodGroup + '」' + rows.length + ' 项' : '')
      + (STATE.foodQuery ? '，搜索命中 ' + rows.length + ' 项' : ''));

    renderFoodHead();
    if (tb) {
      tb.innerHTML = view.length ? view.map(function (f) {
        return '<tr>' + cols.map(function (c) {
          if (c.k === 'label') {
            return '<td>' + esc(f.label) + (f.selectable ? '' : ' <span class="lb-badge">不可选</span>') + '</td>';
          }
          if (c.num) { return '<td class="v">' + fmt(f[c.k]) + '</td>'; }
          return '<td>' + esc(f[c.k] == null ? '' : f[c.k]) + '</td>';
        }).join('') + '</tr>';
      }).join('') : '<tr><td colspan="' + cols.length + '"><span class="lb-empty">没有匹配的食物</span></td></tr>';
    }
    renderFoodPager(rows.length, pages);

    var pools = d.pools || {};
    var names = { breakfast: '早餐池', lunch: '午餐池', dinner: '晚餐池', drink: '饮品池', snack: '加餐池' };
    var box = $('pools');
    if (box) {
      box.innerHTML = Object.keys(pools).map(function (k) {
        var items = (pools[k] || []).map(function (s) { return '<div class="lb-pool-item">· ' + esc(s) + '</div>'; }).join('');
        return '<div><div class="lb-pool-title">' + (names[k] || k) + '（' + (pools[k] || []).length + '）</div>' + items + '</div>';
      }).join('');
    }
  }
  async function loadOrgans() {
    try {
      var res = await window.maibot.query('organs', {});
      if (res && res.success === false) { showError(res.error || 'organs 失败'); return; }
      STATE.organs = res || {};
      showError('');
      renderTabs();
      renderGroups();
      var c = STATE.organs.clock || {};
      txt('hdr-fields', STATE.organs.field_count + ' 个字段');
      txt('hdr-clock', (c.time || '') + ' · 第 ' + (c.day || 1) + ' 天 · ' + (c.phase || ''));
    } catch (e) {
      showError('拉取内脏细则失败：' + (e && e.message ? e.message : e));
    }
  }

  async function loadFoods() {
    try {
      var res = await window.maibot.query('foods', {});
      if (res && res.success === false) { showError(res.error || 'foods 失败'); return; }
      STATE.foods = res || {};
      wireFoodControls();
      renderFoodTabs();
      renderFoods();
    } catch (e) {
      showError('拉取食物库失败：' + (e && e.message ? e.message : e));
    }
  }

  function boot() {
    var n = $('btn-now'); if (n) n.addEventListener('click', function () { window.maibot.navigate('now', {}); });
    var t = $('btn-timeline'); if (t) t.addEventListener('click', function () { window.maibot.navigate('timeline', {}); });
    var vt = $('btn-vitals'); if (vt) vt.addEventListener('click', function () { window.maibot.navigate('vitals', {}); });

    // ---- 串行加载 ----
    // 宿主前端硬限制：所有 maibot.query / action / navigate 加起来，
    // 同时 pending 的请求数 >= 2 就直接拒绝，报 "Two requests are already running"。
    // 页面现在有三个查询（organs / foods / waveforms），必须串行，否则第三个必炸。
    var loading = false;

    async function loadAll() {
      if (loading) return;
      loading = true;
      try {
        await loadOrgans();
        await loadFoods();
        await loadWaveforms();
      } catch (e) {
        console.warn('页面加载异常', e);
      } finally {
        loading = false;
      }
    }

    var r = $('btn-refresh');
    if (r) r.addEventListener('click', function () { WAVE.failed = false; loadAll(); });

    loadAll();

    setInterval(function () {
      if (!loading && !document.hidden) loadAll();
    }, 15000);

    // 动画循环只在这里启动一次。若在 loadWaveforms 成功时也启动，
    // 每加载一轮就会多一个并行循环，指数增长后撞上并发限制。
    if (!waveLoopRunning) { requestAnimationFrame(waveLoop); }

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && !waveLoopRunning && WAVE.ecg.length) {
        waveStart = 0;
        requestAnimationFrame(waveLoop);
      }
    });

    window.addEventListener('maibot:context', function (ev) {
      var ctx = ev && ev.detail;
      if (!ctx) return;
      txt('hdr-theme', ctx.theme === 'dark' ? '暗色' : '亮色');
    });
  }

  window.maibot.ready.then(function (ctx) {
    txt('hdr-theme', ctx && ctx.theme === 'dark' ? '暗色' : '亮色');
    boot();
  });
})();
</script>
