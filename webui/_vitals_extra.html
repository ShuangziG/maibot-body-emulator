<style>
  .lb-vscore{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .lb-vscore-ring{width:104px;height:104px;border-radius:50%;flex:0 0 auto;position:relative;
    background:conic-gradient(var(--series-3) 0turn, var(--lb-soft) 0turn);
    display:grid;place-items:center}
  .lb-vscore-ring::after{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--lb-card,var(--lb-surface))}
  .lb-vscore-ring b{position:relative;z-index:1;font-size:24px;font-weight:700;font-family:var(--lb-font-mono)}
  .lb-vscore-body{flex:1;min-width:220px}
  .lb-macro{display:flex;flex-direction:column;gap:6px;margin:8px 0}
  .lb-macro-row{display:grid;grid-template-columns:44px 1fr 70px;gap:8px;align-items:center;font-size:11px;color:var(--lb-muted)}
  .lb-macro-bar{height:8px;border-radius:999px;background:var(--lb-soft);overflow:hidden}
  .lb-macro-bar i{display:block;height:100%;border-radius:999px}
  .lb-macro-row b{font-family:var(--lb-font-mono);color:var(--lb-fg);text-align:right;font-weight:500}
  .lb-flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .lb-flag{font-size:11px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--status-warn) 18%,transparent);color:var(--status-warn)}
  .lb-flag.ok{background:color-mix(in srgb,var(--status-good) 16%,transparent);color:var(--status-good-ink)}
  .lb-subhd{font-size:12px;color:var(--lb-muted);margin-bottom:8px;font-weight:600}
  .lb-habits{display:flex;flex-direction:column;gap:7px}
  .lb-habit{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:baseline;font-size:12px;
    padding:7px 10px;border-radius:10px;border:1px solid var(--lb-border);background:var(--lb-surface)}
  .lb-habit.on.neg{border-color:color-mix(in srgb,var(--status-crit) 45%,transparent);background:color-mix(in srgb,var(--status-crit) 8%,transparent)}
  .lb-habit.on.pos{border-color:color-mix(in srgb,var(--status-good) 45%,transparent);background:color-mix(in srgb,var(--status-good) 7%,transparent)}
  .lb-habit.off{opacity:.55}
  .lb-habit-name{font-weight:600}
  .lb-habit-ev{font-size:11px;color:var(--lb-muted);margin-top:2px;line-height:1.5}
  .lb-note{font-size:11px;color:var(--lb-muted);line-height:1.7}
</style>
