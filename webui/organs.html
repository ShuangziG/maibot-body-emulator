<style>
  .lb-root{--lb-bg:var(--maibot-background,#f9f9f7);--lb-surface:var(--maibot-surface,#fcfcfb);--lb-fg:var(--maibot-foreground,#0b0b0b);--lb-muted:var(--maibot-muted,#6e6d68);--lb-soft:var(--maibot-soft,#f1f0ec);--lb-border:var(--maibot-border,rgba(11,11,11,.10));--lb-primary:var(--maibot-primary,#2a78d6);--lb-primary-fg:var(--maibot-primary-foreground,#fff);--lb-danger:var(--maibot-danger,#d03b3b);--lb-radius:var(--maibot-radius,12px);--lb-font-body:var(--maibot-font-body,system-ui,-apple-system,"Segoe UI","Microsoft YaHei UI",sans-serif);--lb-font-mono:var(--maibot-font-mono,ui-monospace,"JetBrains Mono",Consolas,monospace);--series-1:#2a78d6;--series-2:#eb6834;--series-3:#1baf7a;--series-4:#eda100;--series-7:#6250d6;--status-good:#0ca30c;--status-good-ink:#006300;--status-warn:#fab219;--status-crit:#d03b3b;--chart-grid:#e1e0d9;--chart-axis:#c3c2b7;--chart-label:#6e6d68;font-family:var(--lb-font-body);color:var(--lb-fg);background:var(--lb-bg);padding:20px 24px 40px;max-width:1440px;margin:0 auto;box-sizing:border-box}
  :root.dark .lb-root,html.dark .lb-root{--lb-bg:var(--maibot-background,#0d0d0d);--lb-surface:var(--maibot-surface,#1a1a19);--lb-fg:var(--maibot-foreground,#f0efec);--lb-muted:var(--maibot-muted,#9a9890);--lb-soft:var(--maibot-soft,#252523);--lb-border:var(--maibot-border,rgba(255,255,255,.10));--series-1:#3987e5;--series-2:#d95926;--series-3:#199e70;--series-4:#c98500;--series-7:#9085e9;--status-good-ink:#0ca30c;--chart-grid:#2c2c2a;--chart-axis:#383835;--chart-label:#9a9890}
  html,body{margin:0;padding:0;background:var(--maibot-background,#f9f9f7)}
  html.dark body,:root.dark body{background:var(--maibot-background,#0d0d0d)}
  .lb-root *{box-sizing:border-box}
  .lb-topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--lb-border);flex-wrap:wrap}
  .lb-brand{display:flex;gap:12px;align-items:center}
  .lb-brand-icon{width:38px;height:38px;border-radius:10px;background:var(--lb-primary);color:var(--lb-primary-fg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .lb-brand-title{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--lb-fg)}
  .lb-brand-sub{font-size:12px;color:var(--lb-muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .lb-actions{display:flex;gap:8px;flex-wrap:wrap}
  .lb-btn{padding:7px 13px;border-radius:var(--lb-radius);border:1px solid var(--lb-border);background:var(--lb-surface);color:var(--lb-fg);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;font-family:inherit}
  .lb-btn:hover{background:var(--lb-soft)}
  .lb-btn:disabled{opacity:.45;cursor:not-allowed}
  .lb-btn-primary{background:var(--lb-primary);color:var(--lb-primary-fg);border-color:transparent}
  .lb-btn-primary:hover{filter:brightness(1.08);background:var(--lb-primary)}
  .lb-err{display:none;margin-bottom:16px;padding:10px 14px;border-radius:var(--lb-radius);border:1px solid var(--status-crit);background:color-mix(in srgb,var(--status-crit) 10%,transparent);font-size:13px}
  .lb-err.on{display:block}
  .lb-grid{display:grid;gap:14px}
  .lb-hero{grid-template-columns:1.1fr 2fr}
  @media(max-width:900px){.lb-hero{grid-template-columns:1fr}}
  .lb-card{background:var(--lb-surface);border:1px solid var(--lb-border);border-radius:var(--lb-radius);padding:16px 18px}
  .lb-card-hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
  .lb-card-hd h2{margin:0;font-size:14px;font-weight:600;letter-spacing:.01em}
  .lb-card-sub{font-size:12px;color:var(--lb-muted);font-weight:400}
  .lb-clock{font-family:var(--lb-font-mono);font-size:44px;font-weight:600;line-height:1;letter-spacing:-.02em}
  .lb-clock-row{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .lb-pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--lb-soft);color:var(--lb-muted);font-weight:500}
  .lb-alive{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--status-good);margin-right:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--status-good) 18%,transparent)}
  .lb-vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
  .lb-vital{background:var(--lb-surface);border:1px solid var(--lb-border);border-radius:var(--lb-radius);padding:12px 14px;position:relative;overflow:hidden}
  .lb-vital::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tone,transparent)}
  .lb-vital-label{font-size:12px;color:var(--lb-muted);margin-bottom:6px}
  .lb-vital-value{font-family:var(--lb-font-mono);font-size:24px;font-weight:600;line-height:1.1}
  .lb-vital-unit{font-size:11px;color:var(--lb-muted);margin-left:3px;font-family:var(--lb-font-body)}
  .lb-vital-text{font-size:11px;margin-top:6px;color:var(--tone,var(--lb-muted))}
  .tone-good{--tone:var(--status-good)}
  .tone-warn{--tone:var(--status-warn)}
  .tone-crit{--tone:var(--status-crit)}
  .lb-feel{display:flex;flex-direction:column;gap:9px}
  .lb-feel-row{display:grid;grid-template-columns:52px 1fr 96px;gap:10px;align-items:center;font-size:12px}
  .lb-bar{height:6px;border-radius:999px;background:var(--lb-soft);overflow:hidden}
  .lb-bar i{display:block;height:100%;border-radius:999px;background:var(--lb-primary);transition:width .4s}
  .lb-feel-word{color:var(--lb-muted);text-align:right;font-size:11px}
  .lb-speech{font-size:14px;line-height:1.85;white-space:pre-wrap}
  .lb-mono{font-family:var(--lb-font-mono);font-size:12px;color:var(--lb-muted);background:var(--lb-soft);padding:6px 10px;border-radius:8px;display:inline-block;margin-top:10px;word-break:break-all}
  .lb-gut-row{display:flex;justify-content:space-between;font-size:12px;color:var(--lb-muted);margin:10px 0 6px}
  .lb-gut-row b{color:var(--lb-fg);font-weight:600}
  .lb-meter{height:8px;border-radius:999px;background:var(--lb-soft);overflow:hidden;margin-bottom:4px}
  .lb-meter i{display:block;height:100%;border-radius:999px;background:var(--series-3)}
  .lb-ev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
  .lb-ev li{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--lb-border);font-size:12px}
  .lb-ev li:last-child{border-bottom:none}
  .lb-ev-time{font-family:var(--lb-font-mono);color:var(--lb-muted);font-size:11px}
  .lb-tag{font-size:10px;padding:1px 7px;border-radius:999px;background:var(--lb-soft);color:var(--lb-muted);white-space:nowrap}
  .lb-charts{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:900px){.lb-charts{grid-template-columns:1fr 1fr}}
  .lb-chart-legend{display:flex;gap:12px;font-size:11px;color:var(--lb-muted);margin-bottom:6px;flex-wrap:wrap}
  .lb-chart-legend span{display:inline-flex;align-items:center;gap:5px}
  .lb-dot{width:8px;height:8px;border-radius:2px;display:inline-block}
  canvas.lb-canvas{width:100%;height:130px;display:block}
  /* 曲线悬停读数（v1.3.2）：刻度只能给 5 档，具体到某一分钟的数要靠它 */
  .lb-chart-tip{position:fixed;pointer-events:none;z-index:9999;display:none;background:var(--lb-surface);border:1px solid var(--lb-border);border-radius:8px;padding:6px 9px;font-size:11px;line-height:1.65;color:var(--lb-fg);box-shadow:0 4px 14px rgba(0,0,0,.18);white-space:nowrap}
  .lb-chart-tip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
  .lb-chart-tip b{font-weight:600}
  .lb-empty{font-size:12px;color:var(--lb-muted);padding:16px 0;text-align:center}
  .lb-foot{margin-top:18px;font-size:11px;color:var(--lb-muted);line-height:1.7}
  /* 急救 / 住院横幅 */
  .lb-hospital{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:14px 18px;border-radius:12px;
    background:linear-gradient(90deg,rgba(214,69,69,.12),rgba(214,69,69,.04));
    border:1px solid rgba(214,69,69,.38)}
  .lb-hospital[hidden]{display:none}
  .lb-hospital-warn{background:linear-gradient(90deg,rgba(214,150,40,.12),rgba(214,150,40,.04));
    border-color:rgba(214,150,40,.38)}
  .lb-hospital-icon{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;
    background:rgba(214,69,69,.16);color:#d64545;font-size:17px;font-weight:700}
  .lb-hospital-warn .lb-hospital-icon{background:rgba(214,150,40,.16);color:#c98a1e}
  .lb-hospital-body{flex:1;min-width:0}
  .lb-hospital-title{font-size:14px;font-weight:600;color:var(--lb-fg)}
  .lb-hospital-sub{font-size:12px;color:var(--lb-muted);margin-top:4px;line-height:1.6}
  .lb-hospital-meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .lb-hospital-tag{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--lb-soft);
    color:var(--lb-muted);white-space:nowrap}
  .lb-linkbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:9px 14px;border-radius:10px;
    background:var(--lb-soft);border:1px solid var(--lb-line);font-size:12px;color:var(--lb-muted)}
  .lb-linkbar-dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--lb-muted)}
  .lb-linkbar.on .lb-linkbar-dot{background:var(--status-good)}
  .lb-linkbar.err .lb-linkbar-dot{background:var(--status-crit)}
  .lb-linkbar-text{flex:1;min-width:0;color:var(--lb-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb-linkbar-meta{font-size:11px;white-space:nowrap}
  /* ---- 睡眠结构（_now_body.html 用） ---- */
  .lb-sleep-bar{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--lb-soft);margin-top:8px}

  .lb-sleep-bar span{display:block;height:100%;transition:width .4s ease}
  .lb-sleep-bar span.light{background:var(--series-2)}
  .lb-sleep-bar span.deep{background:var(--series-1)}
  .lb-sleep-bar span.rem{background:var(--series-3)}
  .lb-sleep-bar span.awake{background:var(--lb-muted);opacity:.35}

  /* ---- 月经周期环 ---- */
  .lb-cycle-wrap{display:flex;align-items:center;gap:16px;margin-top:6px}
  .lb-cycle-ring{width:96px;height:96px;border-radius:50%;flex:0 0 auto;position:relative;
    background:conic-gradient(var(--series-1) 0turn, var(--series-2) 0.5turn, var(--series-3) 1turn);
    display:flex;align-items:center;justify-content:center}
  .lb-cycle-ring::after{content:'';position:absolute;inset:11px;border-radius:50%;background:var(--lb-card)}
  .lb-cycle-ring b{position:relative;z-index:1;font-size:15px;font-weight:700;color:var(--lb-fg)}
  .lb-cycle-info{flex:1;min-width:0}

  @media(max-width:720px){.lb-hospital-meta{width:100%;justify-content:flex-start}
    .lb-cycle-wrap{flex-direction:column;align-items:flex-start}}
</style>

<style>

  .lb-table th{text-align:left;font-weight:500;color:var(--lb-muted);padding:6px 8px;border-bottom:1px solid var(--lb-border);font-size:11px;white-space:nowrap}
  .lb-table td{padding:5px 8px;border-bottom:1px dashed var(--lb-border);font-size:11px;white-space:nowrap}
  .lb-table td.v{font-family:var(--lb-font-mono)}
  .lb-table tr:last-child td{border-bottom:none}
  .lb-chip{padding:5px 11px;border-radius:999px;border:1px solid var(--lb-border);background:var(--lb-surface);font-size:12px;cursor:pointer;color:var(--lb-fg);font-family:inherit;transition:.15s}
  .lb-chip.on{background:var(--lb-primary);color:var(--lb-primary-fg);border-color:transparent}
  .lb-kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--lb-border);font-size:12px}

  .lb-kv span:first-child{color:var(--lb-muted)}
  .lb-kv span:last-child{font-family:var(--lb-font-mono);font-weight:500}
  .lb-pool-title{font-size:12px;font-weight:600;margin-bottom:6px}
  .lb-pool-item{font-size:12px;color:var(--lb-muted);padding:3px 0}
  /* v1.3.1：分组卡片默认只给关键字段，这里是与折叠配套的展开按钮 */
  .lb-more{display:block;width:100%;margin-top:6px;padding:6px 10px;border-radius:8px;
    border:1px dashed var(--lb-border);background:transparent;color:var(--lb-muted);
    font-size:11px;font-family:inherit;cursor:pointer;transition:.15s;text-align:center}
  .lb-more:hover{color:var(--lb-fg);border-color:var(--lb-primary)}
  /* 2026-11-27（1.4.1-dev）：食物库搜索 / 排序 / 分页 */
  .lb-food-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 0}
  .lb-input{flex:1 1 220px;min-width:160px;padding:7px 11px;border-radius:8px;border:1px solid var(--lb-border);

  .lb-pager{display:flex;gap:10px;align-items:center;margin-top:10px}

  details.lb-card[open]>summary::before{content:"\25BE"}

<script>
(function () {
  'use strict';

  // expanded：哪些分组被展开过（点「展开其余 N 项」）。
  // 记在 STATE 里而不是 DOM 里：15 秒一轮自动刷新会重建 innerHTML，
  // 状态若只存在 DOM 上，用户刚展开的卡片下一轮就自己收回去。
  var STATE = { organs: null, foods: null, active: '', foodGroup: '', expanded: {},
    // 2026-11-27（1.4.1-dev）：食物库的搜索/排序/分页状态
    foodQuery: '', foodSort: '', foodDesc: false, foodPage: 0, foodDense: false };

  function $(id) { return document.getElementById(id); }
  function txt(id, v) { var el = $(id); if (el) el.textContent = v; }

  function showError(msg) {
    var box = $('err');
    if (!msg) { if (box) box.classList.remove('on'); return; }
    if (box) box.classList.add('on');
    txt('err-text', msg);
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function renderTabs() {
    var d = STATE.organs || {};
    var groups = d.groups || [];
    var box = $('tabs');
    if (!box) return;
    var list = [{ id: '', title: '全部' }].concat(groups.map(function (g) { return { id: g.id, title: g.title }; }));
    box.innerHTML = list.map(function (g) {
      var on = (g.id === STATE.active) ? ' on' : '';
      return '<button type="button" class="lb-chip' + on + '" data-gid="' + g.id + '">' + esc(g.title) + '</button>';
    }).join('');
    box.querySelectorAll('[data-gid]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        STATE.active = btn.getAttribute('data-gid') || '';
        renderTabs();
        renderGroups();
      });
    });
  }

  // 一行字段（label + 单位 + 值）
  function kvRow(r) {
    return '<div class="lb-kv"><span>' + esc(r.label) +
      (r.unit ? ' <em style="font-style:normal;opacity:.6">' + esc(r.unit) + '</em>' : '') +
      '</span><span>' + fmt(r.value) + '</span></div>';
  }

  // 2026-11-21（v1.3.1）：内脏页 160 个字段全量平铺等于刷屏。
  // 默认只给后端指定的「关键字段」（g.key），其余折叠；字段少的分组不折叠。
  // 关键字段的取舍在 plugin.py 的 KEY_FIELDS 里，前端不硬编码任何字段名 ——
  // 加一个字段或换一个关键量只改一处。
  function renderGroups() {
    var d = STATE.organs || {};
    var groups = d.groups || [];
    var box = $('groups');
    if (!box) return;
    var shown = groups.filter(function (g) { return !STATE.active || g.id === STATE.active; });
    if (!shown.length) { box.innerHTML = '<div class="lb-empty">没有可展示的分组</div>'; return; }
    box.innerHTML = shown.map(function (g) {
      var rows = g.rows || [];
      var keys = g.key || [];
      var isOpen = !!STATE.expanded[g.id];
      var keyRows, restRows;
      if (keys.length && keys.length < rows.length) {
        var set = {};
        keys.forEach(function (f) { set[f] = 1; });
        keyRows = rows.filter(function (r) { return set[r.field]; });
        restRows = rows.filter(function (r) { return !set[r.field]; });
      } else {
        keyRows = rows;
        restRows = [];
      }
      var body = keyRows.map(kvRow).join('') + (isOpen ? restRows.map(kvRow).join('') : '');
      var more = '';
      if (restRows.length) {
        more = '<button type="button" class="lb-more" data-more="' + esc(g.id) + '">' +
          (isOpen ? '收起（保留 ' + keyRows.length + ' 项关键）'
                  : '展开其余 ' + restRows.length + ' 项 · 共 ' + rows.length + ' 项') +
          '</button>';
      }
      return '<section class="lb-card" data-group="' + esc(g.id) + '">' +
        '<div class="lb-card-hd"><h2>' + esc(g.title) +
        '</h2><span class="lb-card-sub">' + esc(g.subtitle || '') + '</span></div>' +
        body + more + '</section>';
    }).join('');

    box.querySelectorAll('[data-more]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var gid = btn.getAttribute('data-more');
        STATE.expanded[gid] = !STATE.expanded[gid];
        renderGroups();
      });
    });
  }

  function fmt(v) {
    var n = Number(v);
    if (!isFinite(n)) return esc(v);
    if (Number.isInteger(n)) return String(n);
    return n.toFixed(Math.abs(n) < 10 ? 3 : 1).replace(/0+$/, '').replace(/\.$/, '');
  }

  // ---- 波形数据池（还原自 2026-11-14 备份，issue #11）----
  // 一次取 20 秒，前端本地按时间轴滚动播放，不反复请求接口。
  var WAVE = {
    ecg: [], eeg: [],
    ecgHz: 100, eegHz: 200,
    fetchedAt: 0,
    fetching: false,
    failed: false
  };
  var WAVE_WINDOW_SEC = 8;

  function waveColors() {
    var cs = getComputedStyle(document.documentElement);
    return {
      ecg: cs.getPropertyValue('--series-3').trim() || '#e74c3c',
      eeg: cs.getPropertyValue('--series-1').trim() || '#5c6bc0',
      grid: 'rgba(128,128,128,0.15)'
    };
  }

  async function loadWaveforms() {
    // 并发保护：宿主限制同时只能有 2 个请求。
    if (WAVE.fetching) return;
    WAVE.fetching = true;
    try {
      var res = await window.maibot.query('waveforms', { seconds: 20 });
      if (!res || res.success === false) {
        txt('wave-note', '波形不可用：' + ((res && res.error) || '未知'));
        return;
      }
      var ecg = res.ecg || {};
      var eeg = res.eeg || {};
      WAVE.ecg = ecg.points || [];
      WAVE.eeg = eeg.points || [];
      WAVE.ecgHz = ecg.hz || 100;
      WAVE.eegHz = eeg.hz || 200;
      WAVE.fetchedAt = Date.now();
      txt('wave-ecg-meta', (ecg.bpm || '?') + ' bpm · RR ' + (ecg.rr_ms || '?') + ' ms · ' + (ecg.hz || '?') + ' Hz');
      var bands = eeg.bands || {};
      var stageZh = { awake: '清醒', light: '浅睡', deep: '深睡', rem: 'REM' };
      txt('wave-eeg-meta', (stageZh[eeg.stage] || eeg.stage || '?') +
        ' · δ' + (bands.delta != null ? bands.delta.toFixed(2) : '?') +
        ' θ' + (bands.theta != null ? bands.theta.toFixed(2) : '?') +
        ' α' + (bands.alpha != null ? bands.alpha.toFixed(2) : '?') +
        ' β' + (bands.beta != null ? bands.beta.toFixed(2) : '?'));
      txt('wave-note', res.disclaimer || '仿真波形，非医学数据');
      WAVE.failed = false;
    } catch (e) {
      WAVE.failed = true;
      txt('wave-note', '波形拉取失败：' + (e && e.message ? e.message : e));
    } finally {
      WAVE.fetching = false;
    }
  }

  function renderScan(canvasId, pool, sampleHz, color, elapsedSec) {
    var cv = $(canvasId);
    if (!cv || !pool || pool.length < 2) return;
    var ctx = cv.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 600;
    var h = cv.clientHeight || 90;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var mid = h / 2, amp = h * 0.44;
    var colors = waveColors();
    ctx.strokeStyle = colors.grid;
    ctx.lineWidth = 1;
    for (var s = 1; s < WAVE_WINDOW_SEC; s++) {
      var gx = (s / WAVE_WINDOW_SEC) * w;
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();

    var n = pool.length;
    var totalSec = n / sampleHz;
    var startSec = elapsedSec % Math.max(0.001, totalSec - WAVE_WINDOW_SEC);
    if (startSec < 0) startSec = 0;
    var i0 = Math.floor(startSec * sampleHz);
    var i1 = Math.min(n - 1, Math.floor((startSec + WAVE_WINDOW_SEC) * sampleHz));
    if (i1 - i0 < 2) return;

    ctx.strokeStyle = color;
    ctx.lineWidth = 1.4;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (var i = i0; i <= i1; i++) {
      var x = ((i - i0) / (i1 - i0)) * w;
      var y = mid - pool[i] * amp;
      if (i === i0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(w - 1, 0); ctx.lineTo(w - 1, h); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  var waveStart = 0;
  var waveLoopRunning = false;

  function waveLoop(ts) {
    if (document.hidden || !document.getElementById('wave-ecg')) {
      waveLoopRunning = false;
      waveStart = 0;
      return;
    }
    waveLoopRunning = true;
    if (!waveStart) waveStart = ts;
    var elapsed = (ts - waveStart) / 1000;
    var c = waveColors();
    renderScan('wave-ecg', WAVE.ecg, WAVE.ecgHz, c.ecg, elapsed);
    renderScan('wave-eeg', WAVE.eeg, WAVE.eegHz, c.eeg, elapsed);
    if (elapsed > 16 && !WAVE.fetching && !WAVE.failed) {
      waveStart = ts;
      loadWaveforms();
    }
    requestAnimationFrame(waveLoop);
  }

  // 2026-11-27（1.4.1-dev）：食物库重做。
  //
  // 旧版一次把 312 行塞进 DOM、11 列数字平铺，只能按分组筛 —— 想知道「哪个主食蛋白高」
  // 得自己在几百行里数。现在：搜索（名称 / key / 分组）、分组 chip、点表头排序、
  // 每页 50 行、简表 / 详表切换。列定义只有一份，表头与单元格都由它生成，不会对不上。
  var FOOD_COLS = [
    { k: 'label', t: '名称' },
    { k: 'group', t: '分组' },
    { k: 'portion', t: '份量' },
    { k: 'kcal', t: '热量', num: 1 },
    { k: 'carb_g', t: '碳水', num: 1 },
    { k: 'protein_g', t: '蛋白', num: 1 },
    { k: 'fat_g', t: '脂肪', num: 1 },
    { k: 'na_mmol', t: '钠', num: 1 },
    { k: 'fiber_g', t: '纤维', num: 1 },
    { k: 'k_mg', t: '钾', num: 0 },
    { k: 'ca_mg', t: '钙', num: 0 },
    { k: 'fe_mg', t: '铁', num: 1 },
    { k: 'vc_mg', t: '维C', num: 1 },
    { k: 'alcohol_g', t: '酒精', num: 1 },
    { k: 'caffeine_mg', t: '咖啡因', num: 0 }
  ];
  var FOOD_SIMPLE = ['label', 'group', 'portion', 'kcal', 'carb_g', 'protein_g'];
  var FOOD_PAGE_SIZE = 50;

  function foodCols() {
    return STATE.foodDense ? FOOD_COLS : FOOD_COLS.filter(function (c) {
      return FOOD_SIMPLE.indexOf(c.k) >= 0;
    });
  }

  function foodGroups(all) {
    var seen = {}, out = [];
    (all || []).forEach(function (f) {
      var g = f.group || '其他';
      if (!seen[g]) { seen[g] = 0; out.push(g); }
      seen[g] += 1;
    });
    return out.map(function (g) { return { name: g, count: seen[g] }; });
  }

  function foodRows() {
    var all = (STATE.foods && STATE.foods.foods) || [];
    var q = (STATE.foodQuery || '').trim().toLowerCase();
    var out = all.filter(function (f) {
      if (STATE.foodGroup && (f.group || '其他') !== STATE.foodGroup) return false;
      if (!q) return true;
      return String(f.label || '').toLowerCase().indexOf(q) >= 0
        || String(f.key || '').toLowerCase().indexOf(q) >= 0
        || String(f.group || '').toLowerCase().indexOf(q) >= 0;
    });
    var sk = STATE.foodSort;
    if (sk) {
      var col = FOOD_COLS.filter(function (c) { return c.k === sk; })[0] || {};
      out = out.slice().sort(function (a, b) {
        var r;
        if (col.num) { r = (Number(a[sk]) || 0) - (Number(b[sk]) || 0); }
        else { r = String(a[sk] || '').localeCompare(String(b[sk] || ''), 'zh'); }
        return STATE.foodDesc ? -r : r;
      });
    }
    return out;
  }

  function renderFoodTabs() {
    var box = $('food-tabs');
    if (!box) return;
    var all = (STATE.foods && STATE.foods.foods) || [];
    var list = [{ name: '', count: all.length }].concat(foodGroups(all));
    box.innerHTML = list.map(function (g) {
      var on = (g.name === STATE.foodGroup) ? ' on' : '';
      var label = g.name ? g.name + '（' + g.count + '）' : '全部（' + g.count + '）';
      return '<button type="button" class="lb-chip' + on + '" data-fg="' + esc(g.name) + '">' + esc(label) + '</button>';
    }).join('');
    box.querySelectorAll('[data-fg]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        STATE.foodGroup = btn.getAttribute('data-fg') || '';
        STATE.foodPage = 0;
        renderFoodTabs();
        renderFoods();
      });
    });
  }

  function renderFoodHead() {
    var th = $('food-thead');
    if (!th) return;
    var cols = foodCols();
    th.innerHTML = '<tr>' + cols.map(function (c) {
      var arrow = STATE.foodSort === c.k ? (STATE.foodDesc ? ' ▼' : ' ▲') : '';
      return '<th class="sortable' + (c.num ? ' v' : '') + '" data-sk="' + c.k + '">' + c.t + arrow + '</th>';
    }).join('') + '</tr>';
    th.querySelectorAll('[data-sk]').forEach(function (el) {
      el.addEventListener('click', function () {
        var k = el.getAttribute('data-sk');
        if (STATE.foodSort === k) { STATE.foodDesc = !STATE.foodDesc; }
        else { STATE.foodSort = k; STATE.foodDesc = false; }
        STATE.foodPage = 0;
        renderFoodHead();
        renderFoods();
      });
    });
  }

  function renderFoodPager(total, pages) {
    var box = $('food-pager');
    if (!box) return;
    if (pages <= 1) { box.innerHTML = ''; return; }
    var cur = STATE.foodPage;
    box.innerHTML =
      '<button type="button" class="lb-chip" data-pg="prev"' + (cur <= 0 ? ' disabled' : '') + '>上一页</button>' +
      '<span class="lb-pager-text">第 ' + (cur + 1) + ' / ' + pages + ' 页 · 共 ' + total + ' 项</span>' +
      '<button type="button" class="lb-chip" data-pg="next"' + (cur >= pages - 1 ? ' disabled' : '') + '>下一页</button>';
    box.querySelectorAll('[data-pg]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var dir = btn.getAttribute('data-pg');
        STATE.foodPage = Math.max(0, Math.min(pages - 1, cur + (dir === 'next' ? 1 : -1)));
        renderFoods();
      });
    });
  }

  function wireFoodControls() {
    var q = $('food-q');
    if (q && !q.getAttribute('data-wired')) {
      q.setAttribute('data-wired', '1');
      q.addEventListener('input', function () {
        STATE.foodQuery = q.value || '';
        STATE.foodPage = 0;
        renderFoods();
      });
    }
    var d = $('food-density');
    if (d && !d.getAttribute('data-wired')) {
      d.setAttribute('data-wired', '1');
      d.addEventListener('click', function () {
        STATE.foodDense = !STATE.foodDense;
        d.textContent = STATE.foodDense ? '简表' : '详表';
        d.classList.toggle('on', STATE.foodDense);
        STATE.foodPage = 0;
        renderFoods();
      });
    }
  }

  function renderFoods() {
    var d = STATE.foods || {};
    var tb = $('food-table') ? $('food-table').querySelector('tbody') : null;
    var rows = foodRows();
    var cols = foodCols();
    var pages = Math.max(1, Math.ceil(rows.length / FOOD_PAGE_SIZE));
    if (STATE.foodPage > pages - 1) STATE.foodPage = pages - 1;
    var start = STATE.foodPage * FOOD_PAGE_SIZE;
    var view = rows.slice(start, start + FOOD_PAGE_SIZE);

    txt('food-count', '共 ' + (d.count || rows.length) + ' 项'
      + (STATE.foodGroup ? '，当前「' + STATE.foodGroup + '」' + rows.length + ' 项' : '')
      + (STATE.foodQuery ? '，搜索命中 ' + rows.length + ' 项' : ''));

    renderFoodHead();
    if (tb) {
      tb.innerHTML = view.length ? view.map(function (f) {
        return '<tr>' + cols.map(function (c) {
          if (c.k === 'label') {
            return '<td>' + esc(f.label) + (f.selectable ? '' : ' <span class="lb-badge">不可选</span>') + '</td>';
          }
          if (c.num) { return '<td class="v">' + fmt(f[c.k]) + '</td>'; }
          return '<td>' + esc(f[c.k] == null ? '' : f[c.k]) + '</td>';
        }).join('') + '</tr>';
      }).join('') : '<tr><td colspan="' + cols.length + '"><span class="lb-empty">没有匹配的食物</span></td></tr>';
    }
    renderFoodPager(rows.length, pages);

    var pools = d.pools || {};
    var names = { breakfast: '早餐池', lunch: '午餐池', dinner: '晚餐池', drink: '饮品池', snack: '加餐池' };
    var box = $('pools');
    if (box) {
      box.innerHTML = Object.keys(pools).map(function (k) {
        var items = (pools[k] || []).map(function (s) { return '<div class="lb-pool-item">· ' + esc(s) + '</div>'; }).join('');
        return '<div><div class="lb-pool-title">' + (names[k] || k) + '（' + (pools[k] || []).length + '）</div>' + items + '</div>';
      }).join('');
    }
  }
  async function loadOrgans() {
    try {
      var res = await window.maibot.query('organs', {});
      if (res && res.success === false) { showError(res.error || 'organs 失败'); return; }
      STATE.organs = res || {};
      showError('');
      renderTabs();
      renderGroups();
      var c = STATE.organs.clock || {};
      txt('hdr-fields', STATE.organs.field_count + ' 个字段');
      txt('hdr-clock', (c.time || '') + ' · 第 ' + (c.day || 1) + ' 天 · ' + (c.phase || ''));
    } catch (e) {
      showError('拉取内脏细则失败：' + (e && e.message ? e.message : e));
    }
  }

  async function loadFoods() {
    try {
      var res = await window.maibot.query('foods', {});
      if (res && res.success === false) { showError(res.error || 'foods 失败'); return; }
      STATE.foods = res || {};
      wireFoodControls();
      renderFoodTabs();
      renderFoods();
    } catch (e) {
      showError('拉取食物库失败：' + (e && e.message ? e.message : e));
    }
  }

  function boot() {
    var n = $('btn-now'); if (n) n.addEventListener('click', function () { window.maibot.navigate('now', {}); });
    var t = $('btn-timeline'); if (t) t.addEventListener('click', function () { window.maibot.navigate('timeline', {}); });
    var vt = $('btn-vitals'); if (vt) vt.addEventListener('click', function () { window.maibot.navigate('vitals', {}); });

    // ---- 串行加载 ----
    // 宿主前端硬限制：所有 maibot.query / action / navigate 加起来，
    // 同时 pending 的请求数 >= 2 就直接拒绝，报 "Two requests are already running"。
    // 页面现在有三个查询（organs / foods / waveforms），必须串行，否则第三个必炸。
    var loading = false;

    async function loadAll() {
      if (loading) return;
      loading = true;
      try {
        await loadOrgans();
        await loadFoods();
        await loadWaveforms();
      } catch (e) {
        console.warn('页面加载异常', e);
      } finally {
        loading = false;
      }
    }

    var r = $('btn-refresh');
    if (r) r.addEventListener('click', function () { WAVE.failed = false; loadAll(); });

    loadAll();

    setInterval(function () {
      if (!loading && !document.hidden) loadAll();
    }, 15000);

    // 动画循环只在这里启动一次。若在 loadWaveforms 成功时也启动，
    // 每加载一轮就会多一个并行循环，指数增长后撞上并发限制。
    if (!waveLoopRunning) { requestAnimationFrame(waveLoop); }

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && !waveLoopRunning && WAVE.ecg.length) {
        waveStart = 0;
        requestAnimationFrame(waveLoop);
      }
    });

    window.addEventListener('maibot:context', function (ev) {
      var ctx = ev && ev.detail;
      if (!ctx) return;
      txt('hdr-theme', ctx.theme === 'dark' ? '暗色' : '亮色');
    });
  }

  window.maibot.ready.then(function (ctx) {
    txt('hdr-theme', ctx && ctx.theme === 'dark' ? '暗色' : '亮色');
    boot();
  });
})();
</script>
