<script>
(function () {
  'use strict';

  var STATE = { now: null, history: null };

  function $(id) { return document.getElementById(id); }
  function txt(id, value) { var el = $(id); if (el) el.textContent = value; }

  function showError(msg) {
    var box = $('err');
    if (!msg) { if (box) box.classList.remove('on'); return; }
    if (box) box.classList.add('on');
    txt('err-text', msg);
  }

  function num(v, digits) {
    var n = Number(v);
    if (!isFinite(n)) return '—';
    return n.toFixed(digits);
  }

  function toneClass(tone) {
    if (tone === 'warn') return 'tone-warn';
    if (tone === 'crit') return 'tone-crit';
    if (tone === 'good') return 'tone-good';
    return '';
  }

  function renderClock(d) {
    var c = d.clock || {};
    txt('clock-time', c.time || '--:--');
    txt('clock-phase', c.phase || '—');
    txt('clock-day', '第 ' + (c.day || 1) + ' 天 · 健康 ' + num(c.health, 0) + '/100');
    var alive = $('clock-alive');
    if (alive) {
      var h = d.hospital || {};
      if (h.critical) {
        alive.textContent = '生命体征不稳';
        alive.style.color = 'var(--status-warn)';
      } else if (h.in_hospital) {
        alive.textContent = '住院中';
        alive.style.color = 'var(--status-crit)';
      } else {
        alive.textContent = '运行中';
        alive.style.color = '';
      }
    }
    renderHospital(d);
    renderLink(d);
    txt('foot-dt', num(c.dt, 0));
    txt('foot-speed', num(c.speed, 1));
    var today = d.today || {};
    txt('c-meals', today.meals || 0);
    txt('c-drinks', today.drinks || 0);
    txt('c-uri', today.urinations || 0);
    txt('c-urine', num(today.urine_total_l, 2));
  }

  function renderLink(d) {
    var box = $('linkbar');
    if (!box) return;
    var l = d.link || {};
    box.className = 'lb-linkbar';
    // v1.3.2：l.provider 现在是「实际生效的引擎」，不再等于配置里那行字。
    // 配置写 weave 但实际连麦生活时，这里照样显示麦生活，不再骗人。
    var linkName = (l.provider === 'weave') ? '麦织' : '麦生活';
    // 自动识别时标注来源，便于一眼分辨「自动探到的」与「手填的」。
    var provTag = '';
    if (l.provider_auto) {
      provTag = l.provider_resolved ? '（自动识别）' : '（自动识别中）';
    }
    var dot = $('link-dot');
    var text = $('link-text');
    var meta = $('link-meta');
    if (!l.enabled) {
      text.textContent = '联动未开启 · 身体按自身时钟独立运行';
      meta.textContent = '可在插件配置 [link] 里打开';
      return;
    }
    if (!l.ok) {
      box.className = 'lb-linkbar err';
      text.textContent = '联动已开启，但取不到' + linkName + '状态' + provTag;
      meta.textContent = (l.last_error || linkName + '可能没在运行').slice(0, 48);
      return;
    }
    box.className = 'lb-linkbar on';
    var bits = [];
    if (l.sync_activity) {
      bits.push('睡眠 ' + (typeof l.sleep === 'number' ? l.sleep.toFixed(2) : '未提供'));
      bits.push('活动 ' + (l.activity ? l.activity.toFixed(2) : '0.00'));
    }
    if (l.sync_meal) bits.push(l.meals_external ? '三餐跟日程' : '三餐备用');
    if (l.sync_clock && l.clock_offset) bits.push('时钟对齐 ' + (l.clock_offset > 0 ? '+' : '') + l.clock_offset.toFixed(2) + 'h');
    if (l.inject_state) bits.push('状态注入');
    if (l.share_state) bits.push('主动分享');
    if (l.feeding) bits.push('可喂食');
    text.textContent = '已联动' + linkName + provTag + ' · ' + (l.summary || l.phase || '状态同步中');
    meta.textContent = bits.join('　');
  }

  function renderHospital(d) {
    var box = $('hospital');
    if (!box) return;
    var h = d.hospital || {};
    if (!h.in_hospital && !h.critical) {
      box.hidden = true;
      return;
    }
    box.hidden = false;
    box.className = 'lb-hospital' + (h.critical && !h.in_hospital ? ' lb-hospital-warn' : '');

    var title = $('hospital-title');
    var sub = $('hospital-sub');
    var meta = $('hospital-meta');

    if (h.in_hospital) {
      title.textContent = '正在医院接受急救';
      sub.textContent = (h.reason || '生命体征全面恶化') +
        '　·　还有约 ' + num(h.hours_left, 1) + ' 小时出院';
    } else {
      title.textContent = '生命体征不稳，正在观察';
      sub.textContent = '已持续 ' + num(h.critical_seconds / 60, 0) +
        ' 分钟，超过阈值将自动送医';
    }

    var bits = [];
    if (h.visits) bits.push('累计住院 ' + h.visits + ' 次');
    bits.push(h.rescue_enabled ? '急救已开启' : '急救已关闭');
    if (h.silent_hours > 0) {
      bits.push(h.silent
        ? '静默中（' + num(h.silent_hours, 0) + ' 小时内不回消息）'
        : '静默窗口 ' + num(h.silent_hours, 0) + ' 小时');
    } else {
      bits.push('不拦截消息');
    }
    meta.innerHTML = bits.map(function (b) {
      return '<span class="lb-hospital-tag">' + b + '</span>';
    }).join('');
  }

  function renderVitals(d) {
    var box = $('vitals');
    if (!box) return;
    var items = (d.vitals || []).slice();
    box.innerHTML = items.map(function (v) {
      return '<div class="lb-vital ' + toneClass(v.tone) + '">' +
        '<div class="lb-vital-label">' + v.label + '</div>' +
        '<div class="lb-vital-value">' + num(v.value, v.value % 1 === 0 ? 0 : 1) +
        '<span class="lb-vital-unit">' + v.unit + '</span></div>' +
        '<div class="lb-vital-text">' + (v.text || '\u00a0') + '</div></div>';
    }).join('');
  }

  function renderFeelings(d) {
    var box = $('feelings');
    if (!box) return;
    box.innerHTML = (d.feelings || []).map(function (f) {
      // bar 由后端算好（已按方向归一：满=舒服）。
      // 旧代码直接用 value 当宽度，于是饥饿/口渴的"条长=难受"
      // 与精力的"条长=精神"方向相反，同一页里长度含义不统一。
      var pct = Math.max(0, Math.min(100,
        (f.bar === undefined || f.bar === null) ? (Number(f.value) || 0) : Number(f.bar)));
      return '<div class="lb-feel-row">' +
        '<span>' + f.label + '</span>' +
        '<span class="lb-bar"><i style="width:' + pct + '%;background:' + toneColor(f) + '"></i></span>' +
        '<span class="lb-feel-word">' + (f.text || '') + '</span></div>';
    }).join('');
  }

  function toneColor(f) {
    if (f.tone === 'warn') return 'var(--status-warn)';
    if (f.tone === 'crit') return 'var(--status-crit)';
    return 'var(--lb-primary)';
  }

  function renderGut(d) {
    var g = d.gut || {};
    txt('gut-ml', num(g.gastric_ml, 0));
    txt('gut-phase', g.phase || '—');
    var bar = $('gut-bar');
    if (bar) bar.style.width = Math.max(0, Math.min(100, (Number(g.gastric_ml) || 0) / 1500 * 100)) + '%';
    txt('gut-meal', g.last_meal_items || '还没吃过东西');
    txt('gut-drink', g.last_drink_items || '还没喝过东西');
    txt('gut-bac', num(g.bac, 3) + ' g/L' + (g.bac_text ? '（' + g.bac_text + '）' : ''));
    txt('gut-caf', num(g.caffeine, 0) + ' mg');
    var note = $('gut-note');
    if (note) {
      note.textContent = (Number(g.bac) > 0.1 || Number(g.caffeine) > 40)
        ? '嗜好品通路：乙醇按零级消除 0.15 g/L·h，咖啡因半衰期 5 小时。'
        : '';
    }
  }

  function renderSleep(d) {
    var sl = d.sleep || {};
    var stageZh = { awake: '清醒', light: '浅睡', deep: '深睡', rem: '快速眼动' };
    // 强制睡眠（微睡眠）单独提示
    if (sl.forced_sleep) {
      txt('sl-stage', '强制睡眠中 · 已连续清醒 ' + num(sl.awake_hours, 1) + ' 小时');
    } else {
      txt('sl-stage', sl.sleeping
        ? (stageZh[sl.stage] || sl.stage) + ' · 第 ' + (Number(sl.cycle_index) || 0) + ' 周期'
        : '清醒中');
    }
    txt('sl-cycle', sl.sleeping
      ? '周期进度 ' + Math.round((Number(sl.cycle_pos) || 0) * 100) + '%'
      : '—');
    // 睡眠结构条：四段占比
    var bar = $('sl-bar');
    if (bar) {
      var segs = [
        ['light', sl.light_pct], ['deep', sl.deep_pct], ['rem', sl.rem_pct]
      ];
      var totalPct = segs.reduce(function (a, s) { return a + (Number(s[1]) || 0); }, 0);
      if (totalPct <= 0) {
        bar.innerHTML = '<span class="awake" style="width:100%"></span>';
      } else {
        bar.innerHTML = segs.map(function (s) {
          return '<span class="' + s[0] + '" style="width:' + (Number(s[1]) || 0) + '%"></span>';
        }).join('');
      }
    }
    var hasSleep = (Number(sl.light_h) || 0) + (Number(sl.deep_h) || 0) + (Number(sl.rem_h) || 0) > 0;
    txt('sl-light', hasSleep ? num(sl.light_h, 1) + 'h' : '—');
    txt('sl-deep', hasSleep ? num(sl.deep_h, 1) + 'h' : '—');
    txt('sl-rem', hasSleep ? num(sl.rem_h, 1) + 'h' : '—');
    var q = Number(sl.quality) || 0;
    txt('sl-quality', q > 0 ? q + ' 分' : '—');
    txt('sl-debt', num(sl.debt_h, 1) + ' 小时');
    // 夜间醒来：总次数 + 分类明细
    var wc = Number(sl.wake_count) || 0;
    if (wc > 0) {
      var wp = [];
      if (Number(sl.wake_by_message) > 0) wp.push('消息 ' + sl.wake_by_message);
      if (Number(sl.wake_by_thirst) > 0) wp.push('口渴 ' + sl.wake_by_thirst);
      if (Number(sl.wake_by_bladder) > 0) wp.push('起夜 ' + sl.wake_by_bladder);
      var wd = wp.length ? '（' + wp.join(' / ') + '）' : '';
      txt('sl-wake', wc + ' 次' + wd + (sl.wake_pending ? ' · 等重新入睡' : ''));
    } else {
      txt('sl-wake', '无');
    }
    var note = $('sl-note');
    if (note) {
      if (q <= 0) {
        note.textContent = '将在第一次睡眠后记录。';
      } else if (q >= 80) {
        note.textContent = '睡眠结构良好：深睡与 REM 占比均在健康区间。';
      } else if (q >= 60) {
        note.textContent = '睡眠尚可，时长或深睡比例略偏离参考值。';
      } else {
        note.textContent = '睡眠质量偏低：深睡不足或有中途清醒，睡眠债难以还清。';
      }
    }
  }

  function renderCycle(d) {
    // 月经周期关闭时整块隐藏，不留空壳。
    // v1.3.2：同时把外层栅格收成一列 —— 只隐藏卡片的话，第二列会空着，
    // 睡眠卡片被挤在左边、右侧留一大块空白。
    var wrap = $('cycle-card');
    var grid = $('sleep-cycle-grid');
    if (!d.cycle_enabled) {
      if (wrap) wrap.style.display = 'none';
      if (grid) grid.style.gridTemplateColumns = '1fr';
      return;
    }
    if (wrap) wrap.style.display = '';
    if (grid) grid.style.gridTemplateColumns = '1.4fr 1fr';
    var cy = d.cycle || {};
    txt('cy-phase', cy.phase_text || '—');
    txt('cy-day', num(cy.day, 1) + ' / ' + num(cy.length, 0) + ' 天');
    txt('cy-uterus', cy.uterus_text || '—');
    txt('cy-e2', num(cy.estrogen, 2));
    txt('cy-p4', num(cy.progesterone, 2));
    var pain = Number(cy.pain) || 0;
    txt('cy-pain', pain > 0 ? num(pain, 1) + ' / 100' : '无');
    // 周期环：按当前日占周期比例旋转高亮
    var ring = $('cy-ring');
    if (ring) {
      var ratio = Math.max(0, Math.min(1, (Number(cy.day) || 0) / Math.max(1, Number(cy.length) || 28)));
      ring.style.background = 'conic-gradient(from -90deg, var(--series-1) 0turn, var(--series-1) ' +
        ratio + 'turn, var(--lb-soft) ' + ratio + 'turn, var(--lb-soft) 1turn)';
      ring.innerHTML = '<b>' + Math.round(ratio * 100) + '%</b>';
    }
    var note = $('cy-note');
    if (note) {
      var base;
      if (cy.menstruating) {
        base = '行经期：前列腺素升高引起痛经，疼痛强度按 ES 敏感度调制。';
      } else if (cy.phase === 'ovulation') {
        base = '排卵期：雌激素达峰，基础体温在排卵后上移。';
      } else if (cy.phase === 'luteal') {
        base = '黄体期：孕激素升高，基础体温处于高位。';
      } else {
        base = '卵泡期：雌激素逐步上升，为排卵做准备。';
      }
      // 相位依据（按现实日历 / 从启用时刻累加），日期填错时也会在这里说清楚
      note.textContent = cy.anchor_note ? base + ' ' + cy.anchor_note + '。' : base;
    }
  }

  function renderSpeech(d) {
    var sp = d.speech || {};
    txt('speech', sp.describe || '—');
    txt('brief', sp.brief || '—');
  }

  // 事件 kind -> 中文标签。必须覆盖 body/engine.py 里 Event() 实际发出的
  // 全部 20 种 kind，缺一个就会在界面上露出英文原值（如 sleep_stage）。
  // 与 webui/_timeline_js.html 的 KIND_LABEL 保持同一套用词。
  var KIND_LABEL = {
    meal: '进食', drink: '饮水', urination: '排尿', stool: '排便',
    sleep_start: '入睡', sleep_end: '醒来', sleep_stage: '睡眠分期',
    wake: '夜间唤醒', forced_sleep: '强制入睡', forced_sleep_end: '补觉醒来',
    forced_wake: '强制唤醒', nap_end: '小睡结束',
    exercise_start: '开始运动', exercise_end: '结束运动',
    exercise_rep: '运动分段', doms: '肌肉酸痛',
    menstrual_cycle: '月经周期',
    alert: '告警', critical: '危重', hospital: '送医'
  };

  function renderEvents(d) {
    var ul = $('events');
    if (!ul) return;
    // v1.3.1：引擎不再为分期切换发事件，但旧存档里仍存着成百上千条。
    // 界面上统一滤掉 —— 分期改由「夜间分期图」呈现，不占事件列表。
    var items = (d.events || []).filter(function (e) { return e && e.kind !== 'sleep_stage'; });
    txt('ev-count', '内存中 ' + (d.events_total || items.length) + ' 条');
    if (!items.length) {
      ul.innerHTML = '<li><span class="lb-empty">暂无事件</span></li>';
      return;
    }
    ul.innerHTML = items.map(function (e) {
      return '<li><span class="lb-ev-time">' + (e.clock || '') + '</span>' +
        '<span>' + esc(e.text || '') + '</span>' +
        '<span class="lb-tag">' + (KIND_LABEL[e.kind] || e.kind || '') + '</span></li>';
    }).join('');
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var FONT = '11px system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", sans-serif';

  // 把一组系列换算成可视刻度区间。空数据返回 null。
  function chartSpan(list, zeroBase) {
    var vals = [];
    list.forEach(function (s) {
      (s.data || []).forEach(function (v) { if (isFinite(v)) vals.push(v); });
    });
    if (!vals.length) return null;
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (zeroBase) min = Math.min(0, min);
    if (max - min < 1e-6) { max = min + 1; }
    var pad = (max - min) * 0.12;
    // 非负量（体积、浓度）留白后可能出现负刻度，如胃容量 0 -> -100，须钳回 0
    var lo = min - pad;
    if (min >= 0.0) lo = Math.max(0, lo);
    return { min: lo, max: max + pad };
  }

  // series 里带 axis:'right' 的走右轴，其余共用左轴。
  // 血糖(mmol/L) 与体温(℃) 这类量纲差一个数量级的必须分轴：同轴时血糖
  // 约 1.6 的波动会被体温 37 的绝对值压成一条直线（实测 5px/103px）。
  function drawChart(canvas, series, opts) {
    if (!canvas || !series.length) return;
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    var w = Math.max(240, rect.width || 480);
    var h = 130;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var css = getComputedStyle(canvas);
    var grid = css.getPropertyValue('--chart-grid').trim() || 'rgba(120,120,120,.18)';
    var axis = css.getPropertyValue('--chart-axis').trim() || 'rgba(120,120,120,.45)';

    // v1.3.2：刻度文字另起一个颜色变量。原先刻度数字与坐标轴共用
    // --chart-axis(#c3c2b7)，与浅色背景几乎同色 —— 数值其实一直在画，
    // 只是看不见。暗色主题下同理（#383835 压在 #1a1a19 上）。
    var labelInk = css.getPropertyValue('--chart-label').trim() || '#6e6d68';

    var zeroBase = !!(opts && opts.zeroBase);
    var leftSeries = series.filter(function (s) { return s.axis !== 'right'; });
    var rightSeries = series.filter(function (s) { return s.axis === 'right'; });
    // 全部系列都在右轴时，仍要有主轴可用
    if (!leftSeries.length) { leftSeries = rightSeries; rightSeries = []; }
    // 2026-11-19：允许显式指定量程。原先一律按数据自身范围自适应，
    // 情绪图里左轴三项（欣快/烦躁/压力）实测只落在 0~47，于是压力 47
    // 被画到接近顶端 —— 「明明轻松，看起来却顶格」。固定 0~100 即可。
    var L = (opts && opts.leftDomain)
      ? { min: opts.leftDomain[0], max: opts.leftDomain[1] }
      : chartSpan(leftSeries, zeroBase);
    if (!L) return;
    var R = rightSeries.length
      ? ((opts && opts.rightDomain)
          ? { min: opts.rightDomain[0], max: opts.rightDomain[1] }
          : chartSpan(rightSeries, false))
      : null;

    var leftTick = (opts && opts.tick === 2) ? 1 : 0;
    var rightTick = (opts && opts.tickRight !== undefined)
      ? opts.tickRight : leftTick;

    var padL = 34, padR = R ? 40 : 8, padT = 8, padB = 18;
    var iw = w - padL - padR, ih = h - padT - padB;

    ctx.strokeStyle = grid;
    ctx.lineWidth = 1;
    ctx.font = FONT;
    ctx.fillStyle = labelInk;
    // 5 条参考线（原为 4 条）：只给 4 档时，两端之间的数值全靠估。
    var TICKS = 4;
    for (var i = 0; i <= TICKS; i++) {
      var y = padT + ih * i / TICKS;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + iw, y); ctx.stroke();
      ctx.textAlign = 'left';
      ctx.fillText((L.max - (L.max - L.min) * i / TICKS).toFixed(leftTick), 2, y + 3.5);
      if (R) {
        ctx.textAlign = 'right';
        ctx.fillText((R.max - (R.max - R.min) * i / TICKS).toFixed(rightTick), w - 2, y + 3.5);
      }
    }
    ctx.textAlign = 'left';

    series.forEach(function (s) {
      var ax = (s.axis === 'right' && R) ? R : L;
      var data = s.data || [];
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 1.8;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      var n = data.length;
      var started = false;
      for (var k = 0; k < n; k++) {
        var v = data[k];
        if (!isFinite(v)) { started = false; continue; }
        var px = padL + (n <= 1 ? iw / 2 : iw * k / (n - 1));
        var py = padT + ih - ih * (v - ax.min) / (ax.max - ax.min);
        if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
      }
      ctx.stroke();
    });

    ctx.strokeStyle = axis;
    ctx.beginPath(); ctx.moveTo(padL, padT + ih); ctx.lineTo(padL + iw, padT + ih); ctx.stroke();

    var labels = (opts && opts.labels) || [];
    if (labels.length) {
      ctx.fillStyle = labelInk;
      ctx.fillText(labels[0] || '', padL, h - 6);
      var mid = labels[Math.floor(labels.length / 2)] || '';
      var mw = ctx.measureText(mid).width;
      ctx.fillText(mid, padL + iw / 2 - mw / 2, h - 6);
      var last = labels[labels.length - 1] || '';
      var lw = ctx.measureText(last).width;
      ctx.fillText(last, padL + iw - lw, h - 6);
    }

    // 留一份本次绘制的几何与数据：悬停读数要靠它把鼠标 x 换算成采样点下标。
    canvas.__chart = {
      labels: labels, series: series, L: L, R: R,
      w: w, h: h, padL: padL, padR: padR, padT: padT, ih: ih, iw: iw
    };
  }

  // ---- 曲线悬停读数（v1.3.2）----
  // 刻度只给 5 档，读不出"这一分钟心率到底多少"。指针落在画布上时
  // 定位到最近的采样点，把该点所有序列的原值列出来。
  var _tipEl = null;
  function chartTip() {
    if (_tipEl) return _tipEl;
    _tipEl = document.createElement('div');
    _tipEl.className = 'lb-chart-tip';
    document.body.appendChild(_tipEl);
    return _tipEl;
  }

  function bindChartHover(canvas) {
    if (!canvas || canvas.__hoverBound) return;
    canvas.__hoverBound = true;
    var tip = chartTip();
    canvas.addEventListener('mousemove', function (ev) {
      var st = canvas.__chart;
      if (!st || !st.labels || !st.labels.length) return;
      var rect = canvas.getBoundingClientRect();
      var x = ev.clientX - rect.left;
      var n = st.labels.length;
      var k = n <= 1 ? 0 : Math.round((x - st.padL) / st.iw * (n - 1));
      if (k < 0 || k >= n) { tip.style.display = 'none'; return; }
      var rows = ['<b>' + esc(st.labels[k] || '') + '</b>'];
      st.series.forEach(function (s) {
        var v = (s.data || [])[k];
        if (!isFinite(v)) return;
        var digits = (s.digits === undefined ? 1 : s.digits);
        rows.push('<div><i style="background:' + s.color + '"></i>' +
          esc(s.name || '') + ' <b>' + Number(v).toFixed(digits) + '</b>' +
          (s.unit ? ' ' + esc(s.unit) : '') + '</div>');
      });
      tip.innerHTML = rows.join('');
      tip.style.display = 'block';
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      var px = ev.clientX + 14, py = ev.clientY + 14;
      if (px + tw > window.innerWidth - 8) px = ev.clientX - tw - 14;
      if (py + th > window.innerHeight - 8) py = ev.clientY - th - 14;
      tip.style.left = px + 'px';
      tip.style.top = py + 'px';
    });
    canvas.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
  }

  // ---- 夜间分期图（v1.3.1）----
  // 手机睡眠 App 的那种图：横轴时间，纵轴自上而下 清醒 / REM / 浅睡 / 深睡，
  // 画成条带，再叠一条心率折线。数据来自 webui_history 的 stages（逐分钟分期）
  // 与 series.hr —— 分期是**连续过程**，画成图远比记成事件有用（这正是原先把
  // 时间线刷满的那批事件）。颜色取 CSS 变量，主题切换时重绘自动跟随。
  var HYPNO_LEVEL = { awake: 0, rem: 1, light: 2, deep: 3 };
  var HYPNO_NAME = ['清醒', 'REM', '浅睡', '深睡'];

  function cssColor(name, fallback) {
    // v1.3.2：这些变量定义在 .lb-root 上，读 documentElement 永远读不到，
    // 分期图于是退回写死的 fallback，与图例（在 .lb-root 内、读到真变量）配色对不上，
    // 表现就是「图例有橙色浅睡，图上却找不到」。
    try {
      var root = document.querySelector('.lb-root') || document.body || document.documentElement;
      var v = (getComputedStyle(root).getPropertyValue(name) || '').trim();
      // 嵌套 var(--x,#hex) 不能直接当画布颜色用，遇到就退回兜底值
      if (!v || v.indexOf('var(') === 0) return fallback;
      return v;
    } catch (e) { return fallback; }
  }

  function renderHypnogram() {
    var cv = $('sl-hypno');
    if (!cv) return;
    var h = STATE.history || {};
    var stages = h.stages || [];
    var hr = (h.series && h.series.hr) || [];
    var labels = h.labels || [];
    var note = $('sl-hypno-note');
    var dpr = window.devicePixelRatio || 1;
    var cssW = cv.clientWidth || 480;
    var cssH = 122;
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    var col = {
      awake: cssColor('--lb-muted', '#6e6d68'),
      rem: cssColor('--series-3', '#1baf7a'),
      light: cssColor('--series-2', '#eb6834'),
      deep: cssColor('--series-1', '#2a78d6'),
      muted: cssColor('--lb-muted', '#888'),
      hr: '#eb6834',
      grid: cssColor('--lb-border', 'rgba(0,0,0,.12)')
    };

    var padL = 34, padR = 8, padT = 6, padB = 16;
    var iw = Math.max(10, cssW - padL - padR);
    var ih = Math.max(24, cssH - padT - padB);

    // 找最近一段睡眠：从最后一个非清醒采样往前扩，
    // 容忍 <= 4 个采样（约 4 分钟）的短暂觉醒 —— 夜里翻个身不该把整夜切成两段。
    var last = -1;
    for (var i = stages.length - 1; i >= 0; i--) {
      if (stages[i] && stages[i] !== 'awake') { last = i; break; }
    }
    if (last < 0) {
      if (note) note.textContent = '最近 ' + (h.hours || 12) + ' 小时没有睡眠记录';
      ctx.fillStyle = col.muted;
      ctx.font = '11px sans-serif';
      ctx.fillText('暂无夜间数据', padL, padT + ih / 2);
      return;
    }
    var start = last;
    while (start > 0) {
      if (stages[start - 1] !== 'awake') { start--; continue; }
      var j = start - 1;
      while (j >= 0 && stages[j] === 'awake') { j--; }
      if (j >= 0 && (start - 1 - j) <= 4) { start = j; } else { break; }
    }
    var n = last - start + 1;
    if (note) {
      var stillSleeping = stages[stages.length - 1] !== 'awake';
      note.textContent = '共 ' + (n / 60).toFixed(1) + ' 小时 · 入睡 ' + (labels[start] || '') +
        ' · ' + (stillSleeping ? '仍在睡' : '醒来 ' + (labels[last] || ''));
    }

    var rowH = ih / 4;
    ctx.font = '10px sans-serif';
    for (var L = 0; L < 4; L++) {
      var yc = padT + rowH * (L + 0.5);
      ctx.strokeStyle = col.grid;
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.moveTo(padL, padT + rowH * L);
      ctx.lineTo(padL + iw, padT + rowH * L);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = col.muted;
      ctx.textAlign = 'right';
      ctx.fillText(HYPNO_NAME[L], padL - 4, yc + 3.5);
    }
    ctx.textAlign = 'left';

    // 分期条带：一个采样一段
    var segW = iw / n;
    for (var k = 0; k < n; k++) {
      var st = stages[start + k] || 'awake';
      var lvl = HYPNO_LEVEL[st];
      if (lvl === undefined) { lvl = 0; }
      ctx.fillStyle = col[st] || col.awake;
      ctx.globalAlpha = (st === 'awake') ? 0.35 : 0.95;
      ctx.fillRect(padL + segW * k, padT + rowH * lvl + rowH * 0.18,
                   Math.max(1, segW + 0.4), rowH * 0.64);
    }
    ctx.globalAlpha = 1;

    // 心率折线（右轴 45~110 bpm），只覆盖睡眠窗口
    if (hr.length) {
      ctx.strokeStyle = col.hr;
      ctx.globalAlpha = 0.8;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      var started = false;
      for (var m = 0; m < n; m++) {
        var v = Number(hr[start + m]);
        if (!isFinite(v)) { started = false; continue; }
        var px = padL + iw * (n <= 1 ? 0.5 : (m + 0.5) / n);
        var t = (Math.max(45, Math.min(110, v)) - 45) / 65;
        var py = padT + ih - ih * t;
        if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 起止时刻
    ctx.fillStyle = col.muted;
    ctx.textAlign = 'left';
    ctx.fillText(labels[start] || '', padL, cssH - 4);
    ctx.textAlign = 'right';
    ctx.fillText(labels[last] || '', padL + iw, cssH - 4);
    ctx.textAlign = 'left';
  }

  // 宿主对插件 API 返回值有硬上限（≤20000 个 JSON 元素），窗口太大时后端会
  // 等间隔抽点。这里如实报出实际分辨率，避免"曲线变钝了但没人知道为什么"。
  function renderHistNote(h) {
    var el = $('hist-note');
    if (!el) return;
    var base = '每 60 仿真秒一个采样点';
    if (!h || !h.sampled) { el.textContent = base; return; }
    el.textContent = base + ' · 已降采样至 ' + h.count + ' 点（原 ' + h.source_count +
      ' 点，约 ' + Number(h.stride).toFixed(1) + ' 分钟/点）';
  }

  function renderCharts() {
    var h = STATE.history || {};
    var s = h.series || {};
    var labels = h.labels || [];
    drawChart($('chart-bp'), [
      { data: s.hr || [], color: '#2a78d6', name: '心率', unit: 'bpm', digits: 0 },
      { data: s.sbp || [], color: '#eb6834', name: '收缩压', unit: 'mmHg', digits: 0 },
      { data: s.dbp || [], color: '#1baf7a', name: '舒张压', unit: 'mmHg', digits: 0 }
    ], { labels: labels, tick: 0 });
    // 血糖走左轴、体温走右轴：两者量纲差约 7 倍，同轴会把血糖压平
    // 体温轴必须给固定量程（v1.3.2）。原先右轴按数据自身 min~max 自适应，
    // 而体温在 600 个采样点里只跨 0.10℃，被 12% padding 撑开后再铺满 100px
    // 画布高度 —— 0.01℃ 的量化台阶变成 8px 跳动，看上去就是锯齿。
    // 改法和体温计一样：正常 36.3~37.2，取 36.0~38.0 覆盖正常与轻中度发热，
    // 37℃ 正好落在画面中线。极端体温会顶出边界，比"平滑地看不出异常"更有用。
    drawChart($('chart-meta'), [
      { data: s.glucose || [], color: '#eda100', name: '血糖', unit: 'mmol/L', digits: 2 },
      { data: s.temp || [], color: '#6250d6', axis: 'right', name: '体温', unit: '℃', digits: 2 }
    ], { labels: labels, tick: 2, tickRight: 1, rightDomain: [36.0, 38.0] });
    // v1.2.5：情绪曲线。欣快/烦躁/压力 0~100 走左轴；
    // 瞬时情绪效价 -100~+100 走右轴 —— 两者量纲正负不同，必须分轴。
    drawChart($('chart-emotion'), [
      { data: s.euphoria || [], color: '#1baf7a', name: '欣快', digits: 0 },
      { data: s.dysphoria || [], color: '#eb6834', name: '烦躁', digits: 0 },
      { data: s.stress || [], color: '#8f8f8f', name: '压力', digits: 0 },
      // v1.3.1：心境底色 4 小时慢变量，与瞬时效价同走右轴（都是 -100~+100 量纲）。
      // 没有它时两次对话之间是 0 直线；有了它，曲线才有"这段时间过得怎么样"的底。
      { data: s.mood_tone || [], color: '#c98a00', axis: 'right', name: '心境底色', digits: 0 },
      { data: s.mood_valence || [], color: '#6250d6', axis: 'right', name: '情绪效价', digits: 0 }
    // 左轴固定 0~100（三向体感），右轴固定 -100~+100（瞬时效价）。
    ], { labels: labels, tick: 0, tickRight: 0,
         leftDomain: [0, 100], rightDomain: [-100, 100] });
    // 三张图都挂上悬停读数；已绑定过的会自己跳过，重复调用无副作用
    ['chart-bp', 'chart-meta', 'chart-emotion'].forEach(function (id) { bindChartHover($(id)); });
    // 夜间分期图与曲线共用同一份 history，跟着一起重画
    renderHypnogram();
  }

  async function loadNow() {
    try {
      var res = await window.maibot.query('now', {});
      if (res && res.success === false) { showError(res.error || 'now 返回失败'); return; }
      STATE.now = res || {};
      showError('');
      renderClock(STATE.now);
      renderVitals(STATE.now);
      renderFeelings(STATE.now);
      renderGut(STATE.now);
      renderSpeech(STATE.now);
    renderSleep(STATE.now);
    renderCycle(STATE.now);
      renderEvents(STATE.now);
      txt('hdr-version', 'v' + (STATE.now.version || '?'));
      txt('hdr-generated', (STATE.now.generated_at || '').replace('T', ' '));
      var err = STATE.now.error;
      txt('foot-error', err ? err : '无');
      var on = (STATE.now.clock && STATE.now.clock);
      var exOn = $('btn-ex-on'), exOff = $('btn-ex-off');
      if (exOn && exOff) { exOn.disabled = false; exOff.disabled = false; }
      void on;
    } catch (e) {
      showError('拉取身体状态失败：' + (e && e.message ? e.message : e));
    }
  }

  async function loadHistory() {
    try {
      // v1.3.1：12h 窗口在晚上会把「昨夜」挤出去，夜间分期图就空了。
      // 24h 覆盖一个完整昼夜，曲线与分期图共用这一份数据。
      var res = await window.maibot.query('history', { hours: 24 });
      if (res && res.success === false) { showError(res.error || 'history 返回失败'); return; }
      STATE.history = res || {};
      renderHistNote(STATE.history);
      renderCharts();
    } catch (e) {
      showError('拉取体征曲线失败：' + (e && e.message ? e.message : e));
    }
  }

  async function act(kind, btn) {
    if (btn) btn.disabled = true;
    try {
      var res = await window.maibot.action('intervene', { kind: kind });
      if (res && res.success === false) { showError(res.error || '干预失败'); return; }
      await loadNow();
      await loadHistory();
    } catch (e) {
      showError('干预失败：' + (e && e.message ? e.message : e));
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  function bindActions() {
    document.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.addEventListener('click', function () { act(btn.getAttribute('data-act'), btn); });
    });
    var refresh = $('btn-refresh');
    if (refresh) refresh.addEventListener('click', function () { loadNow(); loadHistory(); });
    var tl = $('btn-timeline');
    if (tl) tl.addEventListener('click', function () { window.maibot.navigate('timeline', {}); });
    var og = $('btn-organs');
    if (og) og.addEventListener('click', function () { window.maibot.navigate('organs', {}); });
  }

  function boot() {
    bindActions();
    loadNow();
    loadHistory();
    setInterval(loadNow, 15000);
    setInterval(loadHistory, 60000);
    window.addEventListener('maibot:context', function (ev) {
      var ctx = ev && ev.detail ? ev.detail : null;
      if (!ctx) return;
      txt('hdr-theme', (ctx.theme === 'dark' ? '暗色' : '亮色'));
      loadHistory();
    });
  }

  window.maibot.ready.then(function (ctx) {
    txt('hdr-theme', (ctx && ctx.theme === 'dark' ? '暗色' : '亮色'));
    boot();
  });
})();
</script>
