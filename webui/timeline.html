<style>
  .lb-root{--lb-bg:var(--maibot-background,#f9f9f7);--lb-surface:var(--maibot-surface,#fcfcfb);--lb-fg:var(--maibot-foreground,#0b0b0b);--lb-muted:var(--maibot-muted,#6e6d68);--lb-soft:var(--maibot-soft,#f1f0ec);--lb-border:var(--maibot-border,rgba(11,11,11,.10));--lb-primary:var(--maibot-primary,#2a78d6);--lb-primary-fg:var(--maibot-primary-foreground,#fff);--lb-danger:var(--maibot-danger,#d03b3b);--lb-radius:var(--maibot-radius,12px);--lb-font-body:var(--maibot-font-body,system-ui,-apple-system,"Segoe UI","Microsoft YaHei UI",sans-serif);--lb-font-mono:var(--maibot-font-mono,ui-monospace,"JetBrains Mono",Consolas,monospace);--series-1:#2a78d6;--series-2:#eb6834;--series-3:#1baf7a;--series-4:#eda100;--series-7:#6250d6;--status-good:#0ca30c;--status-good-ink:#006300;--status-warn:#fab219;--status-crit:#d03b3b;--chart-grid:#e1e0d9;--chart-axis:#c3c2b7;font-family:var(--lb-font-body);color:var(--lb-fg);background:var(--lb-bg);padding:20px 24px 40px;max-width:1440px;margin:0 auto;box-sizing:border-box}
  :root.dark .lb-root,html.dark .lb-root{--lb-bg:var(--maibot-background,#0d0d0d);--lb-surface:var(--maibot-surface,#1a1a19);--lb-fg:var(--maibot-foreground,#f0efec);--lb-muted:var(--maibot-muted,#9a9890);--lb-soft:var(--maibot-soft,#252523);--lb-border:var(--maibot-border,rgba(255,255,255,.10));--series-1:#3987e5;--series-2:#d95926;--series-3:#199e70;--series-4:#c98500;--series-7:#9085e9;--status-good-ink:#0ca30c;--chart-grid:#2c2c2a;--chart-axis:#383835}

  /* 急救 / 住院横幅 */

  @media(max-width:720px){.lb-hospital-meta{width:100%;justify-content:flex-start}}

<div class="maibot-page lb-root" id="lb-timeline-root">
  <header class="lb-topbar">
    <div class="lb-brand">
      <div class="lb-brand-icon" aria-hidden="true">麦</div>
      <div>
        <h1 class="lb-brand-title">麦麦身体 · 时间线</h1>
        <div class="lb-brand-sub">
          <span id="hdr-version">版本加载中…</span><span>·</span>
          <span id="hdr-generated">等待同步</span><span>·</span>
          <span id="hdr-theme">自适应皮肤</span>
        </div>
      </div>
    </div>
    <div class="lb-actions">
      <button type="button" class="lb-btn" id="btn-now">← 此刻</button>
      <button type="button" class="lb-btn" id="btn-organs">内脏细则 →</button>
      <button type="button" class="lb-btn lb-btn-primary" id="btn-refresh">刷新</button>
    </div>
  </header>

  <div class="lb-err" id="err"><strong>数据异常：</strong><span id="err-text"></span></div>

  <div class="lb-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px" id="counts"></div>

  <section class="lb-card" style="margin-bottom:14px">
    <div class="lb-card-hd">
      <h2>全天曲线</h2>
      <span class="lb-card-sub">
        <select id="sel-hours" class="lb-btn" style="padding:4px 10px">
          <option value="6">近 6 小时</option>
          <option value="12" selected>近 12 小时</option>
          <option value="24">近 24 小时</option>
          <option value="48">近 48 小时</option>
        </select>
      </span>
    </div>
    <div class="lb-charts">
      <div>
        <div class="lb-chart-legend">
          <span><i class="lb-dot" style="background:var(--series-1)"></i>心率</span>
          <span><i class="lb-dot" style="background:var(--series-2)"></i>收缩压</span>
          <span><i class="lb-dot" style="background:var(--series-3)"></i>舒张压</span>
        </div>
        <canvas class="lb-canvas" id="chart-bp" height="260"></canvas>
      </div>
      <div>
        <div class="lb-chart-legend">
          <span><i class="lb-dot" style="background:var(--series-4)"></i>血糖</span>
          <span><i class="lb-dot" style="background:var(--series-7)"></i>胃内容物 mL</span>
        </div>
        <canvas class="lb-canvas" id="chart-gut" height="260"></canvas>
      </div>
    </div>
  </section>

  <div class="lb-grid" style="grid-template-columns:1fr;margin-bottom:14px">
    <section class="lb-card">
      <div class="lb-card-hd">
        <h2>事件流</h2>
        <span class="lb-card-sub" id="ev-total">—</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px" id="filters"></div>
      <ul class="lb-ev" id="events"><li><span class="lb-empty">暂无事件</span></li></ul>
    </section>
  </div>

  <section class="lb-card">
    <div class="lb-card-hd"><h2>采样回放</h2><span class="lb-card-sub" id="replay-hint">最近 40 个采样点，从旧到新</span></div>
    <div style="overflow:auto">
      <table class="lb-table" id="replay-table">
        <thead><tr><th>时刻</th><th>天</th><th>心率</th><th>血压</th><th>血糖</th><th>体温</th><th>精力</th><th>胃</th></tr></thead>
        <tbody><tr><td colspan="8"><span class="lb-empty">—</span></td></tr></tbody>
      </table>
    </div>
  </section>

  <div class="lb-foot">
    事件来自引擎的离散行为发射；曲线来自插件内存环形缓冲，重启后由存档恢复最近的采样点。
  </div>
</div>
<style>
  .lb-table{width:100%;border-collapse:collapse;font-size:12px}
  .lb-table th{text-align:left;font-weight:500;color:var(--lb-muted);padding:6px 8px;border-bottom:1px solid var(--lb-border);font-size:11px;white-space:nowrap}
  .lb-table td{padding:6px 8px;border-bottom:1px dashed var(--lb-border);font-family:var(--lb-font-mono);font-size:11px;white-space:nowrap}
  .lb-table tr:last-child td{border-bottom:none}
  .lb-stat{background:var(--lb-surface);border:1px solid var(--lb-border);border-radius:var(--lb-radius);padding:12px 14px}
  .lb-stat-label{font-size:11px;color:var(--lb-muted);margin-bottom:5px}
  .lb-stat-value{font-family:var(--lb-font-mono);font-size:22px;font-weight:600}
  .lb-chip{padding:5px 11px;border-radius:999px;border:1px solid var(--lb-border);background:var(--lb-surface);font-size:12px;cursor:pointer;color:var(--lb-fg);font-family:inherit;transition:.15s}
  .lb-chip.on{background:var(--lb-primary);color:var(--lb-primary-fg);border-color:transparent}
  .lb-chip:hover{border-color:var(--lb-primary)}
</style>
<script>
(function () {
  'use strict';

  var STATE = { history: null, events: null, filter: '' };

  function $(id) { return document.getElementById(id); }
  function txt(id, v) { var el = $(id); if (el) el.textContent = v; }

  function showError(msg) {
    var box = $('err');
    if (!msg) { if (box) box.classList.remove('on'); return; }
    if (box) box.classList.add('on');
    txt('err-text', msg);
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function num(v, d) {
    var n = Number(v);
    return isFinite(n) ? n.toFixed(d) : '—';
  }

  var FONT = '11px system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", sans-serif';

  function drawChart(canvas, series, labels, tickDigits) {
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    var w = Math.max(240, rect.width || 480);
    var h = 130;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var css = getComputedStyle(canvas);
    var grid = css.getPropertyValue('--chart-grid').trim() || 'rgba(120,120,120,.18)';
    var axis = css.getPropertyValue('--chart-axis').trim() || 'rgba(120,120,120,.45)';

    var padL = 36, padR = 8, padT = 8, padB = 18;
    var iw = w - padL - padR, ih = h - padT - padB;

    var all = [];
    series.forEach(function (s) { (s.data || []).forEach(function (v) { if (isFinite(v)) all.push(v); }); });
    if (!all.length) return;
    var min = Math.min.apply(null, all), max = Math.max.apply(null, all);
    if (max - min < 1e-6) max = min + 1;
    var pad = (max - min) * 0.12;
    min -= pad; max += pad;

    ctx.strokeStyle = grid; ctx.lineWidth = 1; ctx.font = FONT; ctx.fillStyle = axis;
    for (var i = 0; i <= 3; i++) {
      var y = padT + ih * i / 3;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + iw, y); ctx.stroke();
      ctx.fillText((max - (max - min) * i / 3).toFixed(tickDigits), 2, y + 3.5);
    }

    series.forEach(function (s) {
      var data = s.data || [];
      ctx.strokeStyle = s.color; ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
      ctx.beginPath();
      var n = data.length, started = false;
      for (var k = 0; k < n; k++) {
        var v = data[k];
        if (!isFinite(v)) { started = false; continue; }
        var px = padL + (n <= 1 ? iw / 2 : iw * k / (n - 1));
        var py = padT + ih - ih * (v - min) / (max - min);
        if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
      }
      ctx.stroke();
    });

    ctx.strokeStyle = axis;
    ctx.beginPath(); ctx.moveTo(padL, padT + ih); ctx.lineTo(padL + iw, padT + ih); ctx.stroke();

    if (labels && labels.length) {
      ctx.fillStyle = axis;
      ctx.fillText(labels[0] || '', padL, h - 6);
      var mid = labels[Math.floor(labels.length / 2)] || '';
      ctx.fillText(mid, padL + iw / 2 - ctx.measureText(mid).width / 2, h - 6);
      var last = labels[labels.length - 1] || '';
      ctx.fillText(last, padL + iw - ctx.measureText(last).width, h - 6);
    }
  }

  function renderCharts() {
    var h = STATE.history || {};
    var s = h.series || {};
    var labels = h.labels || [];
    drawChart($('chart-bp'), [
      { data: s.hr, color: '#2a78d6' },
      { data: s.sbp, color: '#eb6834' },
      { data: s.dbp, color: '#1baf7a' }
    ], labels, 0);
    drawChart($('chart-gut'), [
      { data: s.glucose, color: '#eda100' },
      { data: s.gastric, color: '#6250d6' }
    ], labels, 1);
    txt('replay-hint', '共 ' + (h.count || 0) + ' 个采样点，窗口 ' + (h.hours || 12) + ' 小时');
  }

  function renderCounts() {
    var d = STATE.events || {};
    var counts = d.counts || {};
    var labels = { meal: '进食', drink: '饮水', urination: '排尿', stool: '排便', sleep_start: '入睡', sleep_end: '醒来', alert: '告警' };
    var keys = Object.keys(counts);
    if (!keys.length) keys = ['meal', 'drink', 'urination', 'stool', 'alert'];
    var html = keys.map(function (k) {
      return '<div class="lb-stat"><div class="lb-stat-label">' + (labels[k] || k) + '</div>' +
        '<div class="lb-stat-value">' + (counts[k] || 0) + '</div></div>';
    }).join('');
    html += '<div class="lb-stat"><div class="lb-stat-label">事件总数</div>' +
      '<div class="lb-stat-value">' + (d.total || 0) + '</div></div>';
    var box = $('counts');
    if (box) box.innerHTML = html;
    txt('ev-total', '内存中 ' + (d.total || 0) + ' 条');
  }

  function renderFilters() {
    var d = STATE.events || {};
    var counts = d.counts || {};
    var labels = { '': '全部', meal: '进食', drink: '饮水', urination: '排尿', stool: '排便', sleep_start: '入睡', sleep_end: '醒来', alert: '告警' };
    var keys = [''].concat(Object.keys(counts));
    var box = $('filters');
    if (!box) return;
    box.innerHTML = keys.map(function (k) {
      var on = (k === STATE.filter) ? ' on' : '';
      var label = labels[k] || k;
      var n = k ? (counts[k] || 0) : (d.total || 0);
      return '<button type="button" class="lb-chip' + on + '" data-kind="' + k + '">' + label + ' ' + n + '</button>';
    }).join('');
    box.querySelectorAll('[data-kind]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        STATE.filter = btn.getAttribute('data-kind') || '';
        renderFilters();
        loadEvents();
      });
    });
  }

  function renderEvents() {
    var ul = $('events');
    if (!ul) return;
    var items = (STATE.events && STATE.events.items) || [];
    if (!items.length) {
      ul.innerHTML = '<li><span class="lb-empty">这个筛选下没有事件</span></li>';
      return;
    }
    var labels = { meal: '进食', drink: '饮水', urination: '排尿', stool: '排便', sleep_start: '入睡', sleep_end: '醒来', alert: '告警' };
    ul.innerHTML = items.map(function (e) {
      return '<li><span class="lb-ev-time">' + esc(e.clock || '') + '</span>' +
        '<span>' + esc(e.text || '') + '</span>' +
        '<span class="lb-tag">第 ' + (e.day || 1) + ' 天 · ' + (labels[e.kind] || e.kind) + '</span></li>';
    }).join('');
  }

  function renderReplay() {
    var h = STATE.history || {};
    var s = h.series || {};
    var labels = h.labels || [];
    var days = h.days || [];
    var n = labels.length;
    var tbody = $('replay-table') ? $('replay-table').querySelector('tbody') : null;
    if (!tbody) return;
    if (!n) { tbody.innerHTML = '<tr><td colspan="8"><span class="lb-empty">没有采样点</span></td></tr>'; return; }
    var start = Math.max(0, n - 40);
    var rows = [];
    for (var i = n - 1; i >= start; i--) {
      rows.push('<tr>' +
        '<td>' + esc(labels[i] || '') + '</td>' +
        '<td>' + (days[i] || 1) + '</td>' +
        '<td>' + num((s.hr || [])[i], 0) + '</td>' +
        '<td>' + num((s.sbp || [])[i], 0) + '/' + num((s.dbp || [])[i], 0) + '</td>' +
        '<td>' + num((s.glucose || [])[i], 2) + '</td>' +
        '<td>' + num((s.temp || [])[i], 2) + '</td>' +
        '<td>' + num((s.energy || [])[i], 0) + '</td>' +
        '<td>' + num((s.gastric || [])[i], 0) + '</td>' +
        '</tr>');
    }
    tbody.innerHTML = rows.join('');
    txt('replay-hint', '显示最近 ' + rows.length + ' 个采样点，最新在前');
  }

  async function loadHistory() {
    var hours = Number(($('sel-hours') || {}).value || 12);
    try {
      var res = await window.maibot.query('history', { hours: hours });
      if (res && res.success === false) { showError(res.error || 'history 失败'); return; }
      STATE.history = res || {};
      showError('');
      renderCharts();
      renderReplay();
      txt('hdr-generated', new Date().toLocaleTimeString());
    } catch (e) {
      showError('曲线拉取失败：' + (e && e.message ? e.message : e));
    }
  }

  async function loadEvents() {
    try {
      var args = { limit: 200 };
      if (STATE.filter) args.kind = STATE.filter;
      var res = await window.maibot.query('events', args);
      if (res && res.success === false) { showError(res.error || 'events 失败'); return; }
      STATE.events = res || {};
      renderCounts();
      renderFilters();
      renderEvents();
    } catch (e) {
      showError('事件拉取失败：' + (e && e.message ? e.message : e));
    }
  }

  function boot() {
    var now = $('btn-now');
    if (now) now.addEventListener('click', function () { window.maibot.navigate('now', {}); });
    var og = $('btn-organs');
    if (og) og.addEventListener('click', function () { window.maibot.navigate('organs', {}); });
    var rf = $('btn-refresh');
    if (rf) rf.addEventListener('click', function () { loadHistory(); loadEvents(); });
    var sel = $('sel-hours');
    if (sel) sel.addEventListener('change', function () { loadHistory(); });
    loadHistory();
    loadEvents();
    setInterval(loadHistory, 60000);
    window.addEventListener('maibot:context', function (ev) {
      var ctx = ev && ev.detail;
      if (!ctx) return;
      txt('hdr-theme', ctx.theme === 'dark' ? '暗色' : '亮色');
      renderCharts();
    });
    window.addEventListener('resize', function () { renderCharts(); });
  }

  window.maibot.ready.then(function (ctx) {
    txt('hdr-theme', ctx && ctx.theme === 'dark' ? '暗色' : '亮色');
    txt('hdr-version', '麦麦身体');
    boot();
  });
})();
</script>
