<style>
  .lb-table{width:100%;border-collapse:collapse;font-size:12px}
  .lb-table th{text-align:left;font-weight:500;color:var(--lb-muted);padding:6px 8px;border-bottom:1px solid var(--lb-border);font-size:11px;white-space:nowrap}
  .lb-table td{padding:5px 8px;border-bottom:1px dashed var(--lb-border);font-size:11px;white-space:nowrap}
  .lb-table td.v{font-family:var(--lb-font-mono)}
  .lb-table tr:last-child td{border-bottom:none}
  .lb-chip{padding:5px 11px;border-radius:999px;border:1px solid var(--lb-border);background:var(--lb-surface);font-size:12px;cursor:pointer;color:var(--lb-fg);font-family:inherit;transition:.15s}
  .lb-chip.on{background:var(--lb-primary);color:var(--lb-primary-fg);border-color:transparent}
  .lb-kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--lb-border);font-size:12px}
  .lb-kv:last-child{border-bottom:none}
  .lb-kv span:first-child{color:var(--lb-muted)}
  .lb-kv span:last-child{font-family:var(--lb-font-mono);font-weight:500}
  .lb-pool-title{font-size:12px;font-weight:600;margin-bottom:6px}
  .lb-pool-item{font-size:12px;color:var(--lb-muted);padding:3px 0}
  /* v1.3.1：分组卡片默认只给关键字段，这里是与折叠配套的展开按钮 */
  .lb-more{display:block;width:100%;margin-top:6px;padding:6px 10px;border-radius:8px;
    border:1px dashed var(--lb-border);background:transparent;color:var(--lb-muted);
    font-size:11px;font-family:inherit;cursor:pointer;transition:.15s;text-align:center}
  .lb-more:hover{color:var(--lb-fg);border-color:var(--lb-primary)}
  /* 2026-11-27（1.4.1-dev）：食物库搜索 / 排序 / 分页 */
  .lb-food-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 0}
  .lb-input{flex:1 1 220px;min-width:160px;padding:7px 11px;border-radius:8px;border:1px solid var(--lb-border);
    background:var(--lb-surface);color:var(--lb-fg);font-size:12px;font-family:inherit;outline:none}
  .lb-input:focus{border-color:var(--lb-primary)}
  .lb-table th.sortable{user-select:none;cursor:pointer}
  .lb-table th.sortable:hover{color:var(--lb-fg)}
  .lb-pager{display:flex;gap:10px;align-items:center;margin-top:10px}
  .lb-pager-text{font-size:11px;color:var(--lb-muted)}
  .lb-chip[disabled]{opacity:.45;cursor:not-allowed}
  .lb-wave-wrap{margin-top:6px}
  .lb-wave-label{font-size:12px;color:var(--lb-muted);margin-bottom:4px}
  .lb-wave-label span{color:var(--lb-fg);margin-left:6px}
  .lb-wave{width:100%;height:90px;display:block;background:var(--lb-soft);border-radius:6px}
  details.lb-card>summary{list-style:none;display:flex;align-items:baseline;gap:10px;cursor:pointer}
  details.lb-card>summary::-webkit-details-marker{display:none}
  details.lb-card>summary::before{content:"\25B8";color:var(--lb-muted);font-size:12px;transition:.15s}
  details.lb-card[open]>summary::before{content:"\25BE"}
</style>
